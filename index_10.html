<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8e3b63">
<title>Salón · Gestión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  --brand:#8e3b63; --brand-d:#6d2a4b; --brand-l:#f6e8ee; --gold:#c8a165;
  --bg:#faf6f7; --surface:#ffffff; --text:#2b1d24; --muted:#7d6b74; --border:#ecdfe4;
  --ok:#2f9e6b; --warn:#d99a2b; --danger:#d14b55; --wa:#25d366;
  --radius:14px; --shadow:0 1px 2px rgba(60,20,40,.06),0 6px 20px rgba(60,20,40,.06);
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; --serif:'Playfair Display',Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
[hidden]{display:none!important}
h1,h2,h3{margin:0;font-weight:600}
h2{font-family:var(--serif);font-size:1.6rem}
h3{font-size:1rem;margin-bottom:12px}
a{color:var(--brand)}
.muted{color:var(--muted)} .sm{font-size:.85rem} .right{text-align:right}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Botones / inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:9px 14px;border-radius:10px;font:500 .9rem var(--font);cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn:disabled{opacity:.55;cursor:wait}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-d);color:#fff}
.btn.danger{color:var(--danger);border-color:#f2c9cd}
.btn.danger:hover{background:var(--danger);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.big{width:100%;padding:13px;font-size:1rem}
.btn.icon{padding:8px}
.input{width:100%;border:1px solid var(--border);background:#fff;border-radius:10px;padding:9px 11px;font:400 .95rem var(--font);color:var(--text);outline:none;transition:.15s}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-l)}
.input.sm{padding:7px 9px;font-size:.85rem;width:auto}
textarea.input{resize:vertical}
.input-row{display:flex;gap:6px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.form .f{display:flex;flex-direction:column;gap:5px;font-size:.82rem;font-weight:500;color:var(--muted)}
.form .full{grid-column:1/-1}
.form .chk{flex-direction:row;align-items:center;gap:8px;color:var(--text);font-size:.92rem}
.form .chk input{width:18px;height:18px;accent-color:var(--brand)}
@media(max-width:560px){.form{grid-template-columns:1fr}}
.seg{display:inline-flex;background:var(--brand-l);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:8px;font:500 .85rem var(--font);color:var(--brand-d);cursor:pointer}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font:500 .92rem var(--font);color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--brand);border-color:var(--brand)}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:.74rem;font-weight:600;background:color-mix(in srgb,var(--b,#999) 15%,white);color:color-mix(in srgb,var(--b,#999) 80%,black);white-space:nowrap}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar label{font-size:.82rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.toolbar .grow{flex:1;min-width:180px}
.empty{padding:30px 10px;text-align:center;color:var(--muted)}

/* Login */
#login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 10%,var(--brand-l) 0,transparent 45%),radial-gradient(circle at 90% 90%,#f4e6d2 0,transparent 40%),var(--bg)}
.login-box{width:100%;max-width:380px;background:#fff;border-radius:20px;padding:34px 28px;box-shadow:0 20px 60px rgba(110,40,75,.15);text-align:center}
.logo{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,var(--brand),var(--gold));display:grid;place-items:center;margin:0 auto 14px;color:#fff}
.logo svg{width:32px;height:32px}
.login-box h1{font-family:var(--serif);font-size:1.7rem;margin-bottom:4px}
.login-box form{display:grid;gap:12px;margin-top:22px;text-align:left}
.login-err{color:var(--danger);font-size:.88rem;min-height:1.2em;text-align:center}
.lf{display:grid;gap:5px;font-size:.8rem;color:var(--muted)}
.l-alt{margin-top:6px;width:100%;font-weight:500;color:var(--ink)}
.l-pie{margin-top:16px;font-size:.74rem;color:var(--muted);line-height:1.45}.l-pie a{color:inherit}
#l-sub b{color:var(--brand)}

/* Layout */
#app{display:flex;min-height:100vh}
#nav{width:236px;background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:40}
.nav-brand{display:flex;align-items:center;gap:10px;padding:20px 18px 16px}
.nav-brand .logo{width:38px;height:38px;border-radius:11px;margin:0}
.nav-brand .logo svg{width:20px;height:20px}
#brand-name{font-family:var(--serif);font-weight:700;font-size:1.05rem;line-height:1.15}
#nav-list{flex:1;overflow:auto;padding:6px 10px;display:flex;flex-direction:column;gap:2px}
.nav-i{display:flex;align-items:center;gap:11px;border:0;background:none;padding:10px 12px;border-radius:10px;font:500 .93rem var(--font);color:var(--muted);cursor:pointer;text-align:left}
.nav-i:hover{background:var(--bg);color:var(--text)}
.nav-i.on{background:var(--brand-l);color:var(--brand-d)}
.me{border-top:1px solid var(--border);padding:12px 14px;display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;font-size:.85rem;flex:none;background:var(--c,var(--brand))}
.me-info{flex:1;min-width:0}
.me-info b{display:block;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:10px;padding:14px 24px;background:rgba(250,246,247,.9);backdrop-filter:blur(8px);position:sticky;top:0;z-index:30;border-bottom:1px solid var(--border)}
#page-title{font-family:var(--serif);font-size:1.3rem;flex:1}
#menu-btn{display:none}
.view{padding:22px 24px 40px;max-width:1400px;width:100%}
#overlay{display:none}
@media(max-width:900px){
  #nav{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .25s;box-shadow:0 0 40px rgba(0,0,0,.2)}
  #nav.open{transform:none}
  #overlay.on{display:block;position:fixed;inset:0;background:rgba(30,10,20,.35);z-index:35}
  #menu-btn{display:inline-flex}
  .topbar{padding:12px 14px}
  .view{padding:16px 14px 40px}
}

/* Inicio */
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.kpi span{font-size:.8rem;color:var(--muted)}
.kpi b{display:block;font-size:1.45rem;margin-top:4px;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
.stack{display:flex;flex-direction:column;gap:16px}
@media(max-width:1000px){.grid2{grid-template-columns:1fr}}
.mini-list{display:flex;flex-direction:column;gap:8px}
.mini-list div{display:flex;justify-content:space-between;gap:8px;font-size:.9rem;padding:8px 0;border-bottom:1px dashed var(--border)}
.mini-list div:last-child{border:0}

/* Tarjetas de evento */
.timeline{display:flex;flex-direction:column;gap:10px}
.evcard{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--c) 7%,white);border:1px solid color-mix(in srgb,var(--c) 22%,white);border-left:5px solid var(--c);cursor:pointer;transition:.15s}
.evcard:hover{transform:translateX(3px);box-shadow:var(--shadow)}
.evcard.cancelada,.evcard.no_asistio{opacity:.55}
.evcard.cancelada .evcard-title{text-decoration:line-through}
.evcard-time{display:flex;flex-direction:column;align-items:center;min-width:52px;font-variant-numeric:tabular-nums}
.evcard-time b{font-size:1.05rem}
.evcard-time span{font-size:.75rem;color:var(--muted)}
.evcard-body{flex:1;min-width:0}
.evcard-title{font-weight:600}
.evcard-date{font-size:.75rem;color:var(--muted)}

/* Agenda */
.agenda-bar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px 6px 8px;border-radius:999px;border:1px solid var(--border);background:#fff;font:500 .84rem var(--font);cursor:pointer}
.chip i{width:12px;height:12px;border-radius:50%;background:var(--c)}
.chip.off{opacity:.4;text-decoration:line-through}
.cal-wrap{padding:12px}
#calendar{height:calc(100vh - 210px);min-height:560px}
.fc{--fc-border-color:var(--border);--fc-today-bg-color:#fcf3f6;--fc-now-indicator-color:var(--brand);--fc-button-bg-color:#fff;--fc-button-border-color:var(--border);--fc-button-text-color:var(--text);--fc-button-hover-bg-color:var(--brand-l);--fc-button-hover-border-color:var(--brand);--fc-button-active-bg-color:var(--brand);--fc-button-active-border-color:var(--brand);font-size:.86rem}
.fc .fc-button{font-weight:500;text-transform:capitalize;border-radius:9px!important;margin:0 2px!important;box-shadow:none!important;padding:6px 11px}
.fc .fc-button-primary:not(:disabled).fc-button-active{color:#fff}
.fc .fc-toolbar-title{font-family:var(--serif);font-size:1.25rem}
.fc .fc-toolbar-title::first-letter{text-transform:uppercase}
.fc .fc-col-header-cell-cushion{text-transform:capitalize;font-weight:600;color:var(--text);text-decoration:none}
.fc .fc-daygrid-day-number{text-decoration:none;color:var(--muted)}
.fc-event{border-radius:8px!important;border-width:0 0 0 4px!important;cursor:pointer;overflow:hidden}
.fc-timegrid-event .fc-event-main,.fc-daygrid-block-event .fc-event-main{padding:3px 6px}
.ev{line-height:1.25;overflow:hidden;color:#fff}
.ev-t{font-size:.72rem;opacity:.9}
.ev-n{font-weight:600;font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev-s{font-size:.74rem;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev-st{display:inline-block;margin-top:2px;font-size:.66rem;background:rgba(255,255,255,.25);padding:1px 6px;border-radius:6px}
.fc-event.st-cancelada,.fc-event.st-no_asistio{opacity:.45}
.fc-event.st-cancelada .ev-n{text-decoration:line-through}
.fc-event.st-completada{filter:saturate(.55)}
.fc-event.st-pendiente{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.14) 0 6px,transparent 6px 12px)}
.fc-list-event .ev{color:var(--text)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin-bottom:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--b)}
@media(max-width:700px){
  .fc .fc-toolbar{flex-direction:column;gap:8px}
  .fc .fc-toolbar-title{font-size:1.05rem}
  #calendar{height:calc(100vh - 250px)}
}

/* Tablas */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:.76rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:left;padding:10px;border-bottom:1px solid var(--border);font-weight:600}
.tbl td{padding:11px 10px;border-bottom:1px solid var(--border);font-size:.92rem}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:#fcf6f8}
.tbl tr.warn td{background:#fff7e8}
.tbl tr.off td{opacity:.5}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:7px;vertical-align:middle}
@media(max-width:700px){
  .tbl thead{display:none}
  .tbl tr{display:block;border:1px solid var(--border);border-radius:12px;margin-bottom:10px;padding:6px 4px;background:#fff}
  .tbl td{display:flex;justify-content:space-between;gap:10px;border:0;padding:6px 10px;text-align:right}
  .tbl td::before{content:attr(data-l);color:var(--muted);font-size:.8rem;text-align:left}
  .tbl .num{text-align:right}
}

/* POS */
.pos{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;align-items:start}
@media(max-width:1000px){.pos{grid-template-columns:1fr}}
.pos-cat .seg{margin-bottom:10px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px;max-height:62vh;overflow:auto;padding:2px}
.pitem{border:1px solid var(--border);border-radius:12px;padding:12px;background:#fff;cursor:pointer;text-align:left;font:inherit;color:inherit;border-top:4px solid var(--c,var(--brand));transition:.15s;display:flex;flex-direction:column;gap:4px}
.pitem:hover{border-color:var(--brand);transform:translateY(-2px)}
.pitem:disabled{opacity:.45;cursor:not-allowed;transform:none}
.pitem b{font-size:.9rem}
.pitem .pp{font-weight:700;color:var(--brand-d)}
.pos-tk{position:sticky;top:80px}
.tk-items{display:flex;flex-direction:column;gap:8px;margin:12px 0;max-height:34vh;overflow:auto}
.tk-it{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:var(--bg)}
.tk-it .nm{flex:1;min-width:0;font-size:.88rem}
.tk-it .nm small{display:block;color:var(--muted)}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:26px;height:26px;border-radius:7px;border:1px solid var(--border);background:#fff;cursor:pointer;font-weight:700}
.tk-tot{border-top:1px dashed var(--border);padding-top:10px;margin-bottom:12px}
.tk-tot div{display:flex;justify-content:space-between;font-size:.9rem;padding:3px 0;font-variant-numeric:tabular-nums}
.tk-tot .grand{font-size:1.35rem;font-weight:700;color:var(--brand-d);padding-top:8px}
.plan-hint{background:#f2f7fc;border:1px solid #d5e5f5;border-radius:10px;padding:8px 10px;font-size:.84rem;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px}

/* Planes */
.promos{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.promo{border:1px solid var(--border);border-radius:var(--radius);background:#fff;overflow:hidden;display:flex;flex-direction:column}
.promo-top{position:relative;padding:18px 16px 16px;color:#fff;background:linear-gradient(135deg,var(--brand-d),var(--brand));display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.promo-top .badge{background:rgba(255,255,255,.92)}
.promo-of{font-family:var(--serif);font-size:2rem;font-weight:700;line-height:1;color:#fff}
.promo-of small{display:block;font-family:Inter,system-ui,sans-serif;font-size:.78rem;font-weight:500;opacity:.9;margin-top:6px;letter-spacing:.02em}
.promo-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.promo-body .row-btns{margin-top:auto;padding-top:8px}
.promo.off{opacity:.62}
.ficha{border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:10px;background:#fff;display:flex;flex-direction:column;gap:6px}
.ficha-h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ficha-f{background:var(--brand-l);border-radius:10px;padding:8px 10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.86rem}
.ficha-f span{display:block;font-family:Inter,system-ui,sans-serif;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--brand-d);margin-bottom:2px}
.ficha-fotos{display:flex;gap:10px}.ficha-fotos figure{margin:0;flex:1;max-width:160px}
.ficha-fotos img,.ficha-prev img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:var(--bg);display:block;cursor:zoom-in;opacity:.35}
.ficha-fotos img.ok,.ficha-prev img.ok{opacity:1}
.ficha-fotos figcaption{font-size:.72rem;color:var(--muted);text-align:center;margin-top:3px}
.ficha-sub{display:flex;gap:14px;flex-wrap:wrap}.ficha-up{display:flex;flex-direction:column;gap:6px;align-items:flex-start;width:140px}
.ficha-prev{width:140px;aspect-ratio:3/4;border:1px dashed var(--border);border-radius:12px;display:grid;place-items:center;overflow:hidden;color:var(--muted);font-size:.78rem}
.ficha-prev img{height:100%}
.foto-full{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:200;display:grid;place-items:center;padding:16px;cursor:zoom-out}
.foto-full img{max-width:100%;max-height:100%;border-radius:10px}
.tl-item{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}.tl-item:last-child{border:0}
.tl-ico{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--brand-l);flex:none;font-size:1rem}
.tl-item .grow{min-width:0}
.cum-row{display:flex;align-items:center;gap:8px}.cum-row .grow{min-width:0}
.web-tag{font-size:.7rem;background:#e7f1ff;color:#2457a6;border-radius:6px;padding:1px 6px;margin-left:4px;font-weight:600;white-space:nowrap}
.rv-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.rv-chips button{border:1px solid var(--border);background:#fff;border-radius:999px;padding:8px 14px;cursor:pointer;font:inherit;color:inherit}
.rv-chips button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.rv-link{display:flex;flex-direction:column;gap:8px;margin-top:12px}
body.reserva{background:radial-gradient(circle at 20% 0,var(--brand-l) 0,transparent 50%),var(--bg);min-height:100vh}
#rv{max-width:560px;margin:0 auto;padding:18px 14px 40px}
.rv-card{background:#fff;border-radius:22px;padding:24px 18px;box-shadow:0 20px 60px rgba(110,40,75,.12)}
.rv-head{text-align:center;margin-bottom:8px}.rv-head h1{font-family:var(--serif);font-size:1.7rem;margin:0}
.rv-head .logo{width:84px;height:84px;margin-bottom:10px}
.rv-ok{font-size:2.4rem;color:#fff}
.rv-msg{background:var(--brand-l);border-radius:12px;padding:10px 12px;font-size:.9rem;margin:12px 0 0}
.rv-paso{border-top:1px solid var(--border);padding-top:16px;margin-top:16px}
.rv-paso h3{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-size:1.02rem}
.rv-paso h3 i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:.82rem}
.rv-cat{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 0 6px}
.rv-svc{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:6px;cursor:pointer}
.rv-svc.on{border-color:var(--brand);background:var(--brand-l)}.rv-svc input{width:18px;height:18px;accent-color:var(--brand)}
.rv-svc small{display:block;color:var(--muted)}
.rv-tot{margin-top:10px;text-align:right;font-size:.92rem}
.rv-dias{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}

const TEXTO = new Set(['telefono','codigo','inicio','fin','fecha','fechaInicio','cumpleanos','creado','valor','fechaGasto','mes','desde','hasta']);
const ESTADOS = ['pendiente','confirmada','en_proceso','completada','cancelada','no_asistio'];
const NO_OCUPA = ['cancelada','no_asistio'];
const ROLES = ['admin','recepcion','estilista'];

const CONFIG_DEF = {
  nombre: 'Mi Salón de Belleza', telefono: '', direccion: '', rtn: '',
  moneda: 'L', isv: '0.15', preciosConISV: 'si',
  apertura: '08:00', cierre: '19:00', intervalo: '15',
  mensajeRecibo: '¡Gracias por tu visita!',
  tema: 'vino', logo: '',
  reservas: 'no', reservaDias: '1,2,3,4,5,6', reservaHoras: '2', reservaMensaje: '',
  regaloCumple: '15% de descuento en el servicio que tú elijas',
  mensajeWA: 'Hola {cliente} 👋, te recordamos tu cita en {salon} el {fecha} a las {hora} para {servicio}. ¡Te esperamos!'
};

const ESCRITURA = {
  Clientes: ['admin','recepcion'],
  PlanesTratamiento: ['admin','recepcion'],
  Servicios: ['admin'],
  Tratamientos: ['admin'],
  Productos: ['admin'],
  Promociones: ['admin','recepcion']
};

/* ===================== ENTRADA HTTP ===================== */

function doGet() {
  return json_({ ok: true, app: 'Salón de Belleza', version: '4.0', funciones: 'promociones, logo, inicio, reservas, fichas, cumpleaños' });
}

function doPost(e) {
  let out;
  try {
    const req = JSON.parse(e.postData.contents || '{}');
    out = { ok: true, data: route_(req) };
  } catch (err) {
    out = { ok: false, error: String(err && err.message ? err.message : err) };
  }
  return json_(out);
}

function json_(o) {
  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);
}

function route_(req) {
  Object.keys(MEMO).forEach(k => { delete MEMO[k]; });
  SALON = null;
  const a = req.action, d = req.data || {};
  if (!MULTI_SALON) {
    const lic = licencia_();
    if (lic.estado === 'vencida') throw new Error('PRUEBA_VENCIDA|' + JSON.stringify({ contacto: CONTACTO_WA, nombre: config_().nombre }));
  }
  if (a === 'login') return MULTI_SALON ? loginMulti_(d) : login_(d);
  if (a === 'registrar') return registrar_(d);
  // Página pública de reservas (sin usuario)
  if (a === 'reservaInfo') return reservaInfo_(d);
  if (a === 'reservaHoras') return reservaHoras_(d);
  if (a === 'reservar') return lock_(() => reservar_(d));
  const u = auth_(req.token);
  switch (a) {
    case 'logout':          CacheService.getScriptCache().remove('S_' + req.token); return true;
    case 'bootstrap':       return bootstrap_(u, d);
    case 'inicio':          return inicio_(u);
    case 'citas':           return citas_(u, d);
    case 'guardarCita':     return lock_(() => guardarCita_(u, d));
    case 'estadoCita':      return lock_(() => estadoCita_(u, d));
    case 'guardar':         return lock_(() => guardar_(u, d));
    case 'eliminar':        return lock_(() => eliminar_(u, d));
    case 'guardarUsuario':  return lock_(() => guardarUsuario_(u, d));
    case 'cambiarClave':    return lock_(() => cambiarClave_(u, d));
    case 'venta':           return lock_(() => venta_(u, d));
    case 'ventas':          return ventas_(u, d);
    case 'anularVenta':     return lock_(() => anularVenta_(u, d));
    case 'dashboard':       return dashboard_(u, d);
    case 'historialCliente':return historialCliente_(u, d);
    case 'gastos':          return gastos_(u, d);
    case 'guardarGasto':    return lock_(() => guardarGasto_(u, d));
    case 'anularGasto':     return lock_(() => anularGasto_(u, d));
    case 'movimientos':     return movimientos_(u, d);
    case 'historial':       return historial_(u);
    case 'guardarDistribucion': return lock_(() => guardarDistribucion_(u, d));
    case 'anularDistribucion':  return lock_(() => anularDistribucion_(u, d));
    case 'promociones':     req_(u, ['admin','recepcion']); return rows_('Promociones');
    case 'guardarFicha':    return lock_(() => guardarFicha_(u, d));
    case 'fichaCliente':    return fichaCliente_(u, d);
    case 'fotoFicha':       return fotoFicha_(u, d);
    default: throw new Error('Acción no válida: ' + a);
  }
}

function lock_(fn) {
  const l = LockService.getScriptLock();
  l.waitLock(20000);
  try { return fn(); } finally { l.releaseLock(); }
}

/* ===================== HOJAS (BASE DE DATOS) ===================== */

const MEMO = {};

function ss_() {
  if (MULTI_SALON && SALON) {
    if (!MEMO._ss) MEMO._ss = SpreadsheetApp.openById(SALON.hojaId);
    return MEMO._ss;
  }
  return SpreadsheetApp.getActiveSpreadsheet();
}
function ck_(name) { return 'H_' + (SALON ? SALON.id + '_' : '') + name; }

function sh_(name) {
  const ss = ss_();
  let s = ss.getSheetByName(name);
  if (!s) {
    s = ss.insertSheet(name);
    const h = SCHEMA[name];
    s.getRange(1, 1, 1, h.length).setValues([h]).setFontWeight('bold').setBackground('#8e3b63').setFontColor('#ffffff');
    s.setFrozenRows(1);
    h.forEach((k, i) => { if (TEXTO.has(k)) s.getRange(2, i + 1, s.getMaxRows() - 1, 1).setNumberFormat('@'); });
  }
  return s;
}

function obj_(h, r) {
  const o = {};
  h.forEach((k, i) => {
    let x = r[i];
    if (x instanceof Date) x = Utilities.formatDate(x, TZ, k === 'mes' ? 'yyyy-MM' : SOLO_FECHA.has(k) ? 'yyyy-MM-dd' : "yyyy-MM-dd'T'HH:mm");
    if (NUMS.has(k)) x = Number(x) || 0;
    else if (BOOLS.has(k)) x = (x === true || x === 'true' || x === 'TRUE' || x === 1 || x === 'SI');
    else x = (x === null || x === undefined) ? '' : String(x);
    o[k] = x;
  });
  return o;
}

// Hojas pequeñas que se guardan en caché unos minutos para responder más rápido
const CACHE_HOJAS = ['Usuarios','Servicios','Tratamientos','Productos','Config','Clientes','PlanesTratamiento'];
const CACHE_SEG = 600;

function rows_(name) {
  if (!MEMO[name]) {
    const cacheable = CACHE_HOJAS.indexOf(name) >= 0;
    let data = null;
    if (cacheable) { try { const c = CacheService.getScriptCache().get(ck_(name)); if (c) data = JSON.parse(c); } catch (e) { data = null; } }
    if (!data) {
      const s = sh_(name), n = s.getLastRow(), h = SCHEMA[name];
      data = n < 2 ? [] : s.getRange(2, 1, n - 1, h.length).getValues()
        .filter(r => r[0] !== '' && r[0] !== null)
        .map(r => obj_(h, r));
      if (cacheable) { try { const j = JSON.stringify(data); if (j.length < 95000) CacheService.getScriptCache().put(ck_(name), j, CACHE_SEG); } catch (e) {} }
    }
    MEMO[name] = data;
  }
  return MEMO[name].map(o => Object.assign({}, o));
}

function invalidar_(name) {
  delete MEMO[name];
  try { CacheService.getScriptCache().remove(ck_(name)); } catch (e) {}
}

function cell_(v) { return (v === undefined || v === null) ? '' : v; }

function findRow_(s, id) {
  const n = s.getLastRow();
  if (n < 2 || !id) return 0;
  const f = s.getRange(2, 1, n - 1, 1).createTextFinder(String(id)).matchEntireCell(true).findNext();
  return f ? f.getRow() : 0;
}

let SEQ_ = 0;
function newId_(name) {
  SEQ_ = (SEQ_ + 1) % 1296;
  return (PREFIJO[name] || 'X') + Date.now().toString(36).toUpperCase() + SEQ_.toString(36).toUpperCase().padStart(2, '0') +
    Math.floor(Math.random() * 1296).toString(36).toUpperCase().padStart(2, '0');
}

function upsert_(name, rec) {
  const s = sh_(name), h = SCHEMA[name];
  const r = rec.id ? findRow_(s, rec.id) : 0;
  let full = rec;
  if (r) {
    const prev = obj_(h, s.getRange(r, 1, 1, h.length).getValues()[0]);
    full = Object.assign(prev, rec);
  } else if (!full.id) {
    full.id = newId_(name);
  }
  const row = h.map(k => cell_(full[k]));
  if (r) s.getRange(r, 1, 1, h.length).setValues([row]);
  else s.appendRow(row);
  invalidar_(name);
  return obj_(h, row);
}

function appendRows_(name, objs) {
  if (!objs.length) return;
  const s = sh_(name), h = SCHEMA[name];
  const vals = objs.map(o => h.map(k => cell_(o[k])));
  s.getRange(s.getLastRow() + 1, 1, vals.length, h.length).setValues(vals);
  invalidar_(name);
}

function deleteRow_(name, id) {
  const s = sh_(name), r = findRow_(s, id);
  if (!r) throw new Error('Registro no encontrado');
  s.deleteRow(r);
  invalidar_(name);
}

function ahora_() { return Utilities.formatDate(new Date(), TZ, "yyyy-MM-dd'T'HH:mm"); }
function hoy_() { return Utilities.formatDate(new Date(), TZ, 'yyyy-MM-dd'); }
function r2_(n) { return Math.round((Number(n) || 0) * 100) / 100; }

/* ===================== SEGURIDAD ===================== */

function hash_(clave, salt) {
  const b = Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256, salt + '|' + clave, Utilities.Charset.UTF_8);
  return Utilities.base64Encode(b);
}

function publico_(u) { const o = Object.assign({}, u); delete o.hash; delete o.salt; return o; }

function req_(u, roles) {
  if (roles.indexOf(u.rol) < 0) throw new Error('No tienes permiso para esta acción');
}

function login_(d) {
  const c = CacheService.getScriptCache();
  const usuario = String(d.usuario || '').trim().toLowerCase();
  const kf = 'F_' + usuario;
  const fallos = Number(c.get(kf) || 0);
  if (fallos >= 5) throw new Error('Demasiados intentos fallidos. Espera 10 minutos.');
  const u = rows_('Usuarios').find(x => String(x.usuario).toLowerCase() === usuario);
  if (!u || !u.activo || hash_(String(d.clave || ''), u.salt) !== u.hash) {
    c.put(kf, String(fallos + 1), 600);
    throw new Error('Usuario o contraseña incorrectos');
  }
  c.remove(kf);
  const token = Utilities.getUuid().replace(/-/g, '') + Utilities.getUuid().replace(/-/g, '');
  c.put('S_' + token, u.id, SESION_SEG);
  return { token: token, usuario: publico_(u) };
}

function auth_(token) {
  if (!token) throw new Error('SESION');
  const c = CacheService.getScriptCache();
  const val = c.get('S_' + token);
  if (!val) throw new Error('SESION');
  let uid = val;
  if (MULTI_SALON) {
    const p = val.split('|'), lic = salonPorId_(p[0]);
    if (!lic) throw new Error('SESION');
    setSalon_(lic); uid = p[1];
    bloquearSiVence_();
  }
  const u = rows_('Usuarios').find(x => x.id === uid);
  if (!u || !u.activo) throw new Error('SESION');
  c.put('S_' + token, val, SESION_SEG); // sesión deslizante
  return u;
}

function cambiarClave_(u, d) {
  if (hash_(String(d.actual || ''), u.salt) !== u.hash) throw new Error(MULTI_SALON ? 'El PIN actual no es correcto' : 'La contraseña actual no es correcta');
  if (MULTI_SALON ? !/^\d{4,6}$/.test(String(d.nueva || '')) : String(d.nueva || '').length < 6) throw new Error(MULTI_SALON ? 'El PIN debe tener de 4 a 6 números' : 'La nueva contraseña debe tener al menos 6 caracteres');
  const salt = Utilities.getUuid();
  upsert_('Usuarios', { id: u.id, salt: salt, hash: hash_(d.nueva, salt) });
  return true;
}

function guardarUsuario_(u, d) {
  req_(u, ['admin']);
  const r = Object.assign({}, d.registro || {});
  const todos = rows_('Usuarios');
  r.usuario = MULTI_SALON ? waNorm_(r.usuario) : String(r.usuario || '').trim().toLowerCase();
  if (!r.usuario || !r.nombre) throw new Error(MULTI_SALON ? 'Nombre y WhatsApp son obligatorios' : 'Usuario y nombre son obligatorios');
  if (MULTI_SALON) {
    if (r.usuario.length < 10) throw new Error('Escribe un número de WhatsApp válido');
    if (mRows_('Accesos').some(x => String(x.whatsapp) === r.usuario && !(x.salonId === SALON.id && x.usuarioId === r.id))) throw new Error('Ese WhatsApp ya está registrado en otra cuenta');
  }
  if (/\s/.test(r.usuario)) throw new Error('El usuario no debe tener espacios');
  if (todos.some(x => x.usuario === r.usuario && x.id !== r.id)) throw new Error('Ese nombre de usuario ya existe');
  if (ROLES.indexOf(r.rol) < 0) throw new Error('Rol no válido');
  if (r.id === u.id && (r.rol !== 'admin' || r.activo === false)) throw new Error('No puedes quitarte el rol de administrador ni desactivarte');
  delete r.hash; delete r.salt;
  if (d.clave) {
    if (MULTI_SALON && !/^\d{4,6}$/.test(String(d.clave))) throw new Error('El PIN debe tener de 4 a 6 números');
    if (!MULTI_SALON && String(d.clave).length < 6) throw new Error('La contraseña debe tener al menos 6 caracteres');
    r.salt = Utilities.getUuid();
    r.hash = hash_(d.clave, r.salt);
  } else if (!r.id) {
    throw new Error(MULTI_SALON ? 'Asigna un PIN al nuevo integrante' : 'Asigna una contraseña al nuevo usuario');
  }
  if (!r.id) r.creado = ahora_();
  const g = upsert_('Usuarios', r);
  if (MULTI_SALON) {
    const acc = mRows_('Accesos').find(x => x.salonId === SALON.id && x.usuarioId === g.id);
    if (acc) mSet_('Accesos', acc._fila, { whatsapp: g.usuario, activo: g.activo });
    else mAppend_('Accesos', { whatsapp: g.usuario, salonId: SALON.id, usuarioId: g.id, activo: g.activo });
    if (SALON.lic._fila) mSet_('Licencias', SALON.lic._fila, { usuarios: rows_('Usuarios').filter(x => x.activo).length });
  }
  return publico_(g);
}

/* ===================== DATOS GENERALES ===================== */

function config_() {
  const o = Object.assign({}, CONFIG_DEF);
  rows_('Config').forEach(r => { o[r.clave] = String(r.valor); });
  return o;
}

function guardarConfig_(reg) {
  if (reg && reg.logo && String(reg.logo).length > 48000) throw new Error('El logo es muy pesado. Usa una imagen más sencilla o más pequeña.');
  const s = sh_('Config');
  const actual = Object.assign(config_(), reg || {});
  const vals = Object.keys(actual).map(k => [k, String(actual[k])]);
  if (s.getLastRow() > 1) s.getRange(2, 1, s.getLastRow() - 1, 2).clearContent();
  s.getRange(2, 1, vals.length, 2).setValues(vals);
  invalidar_('Config');
  return actual;
}

function bootstrap_(u, d) {
  const r = {
    usuario: publico_(u),
    config: config_(),
    usuarios: rows_('Usuarios').map(publico_),
    clientes: rows_('Clientes'),
    servicios: rows_('Servicios'),
    tratamientos: rows_('Tratamientos'),
    productos: rows_('Productos'),
    planes: rows_('PlanesTratamiento'),
    gastoCats: ['admin','recepcion'].indexOf(u.rol) >= 0 ? catalogoGastos_() : [],
    licencia: licencia_(),
    salonId: MULTI_SALON && SALON ? SALON.id : ''
  };
  if (MULTI_SALON && SALON && SALON.lic._fila) { try { mSet_('Licencias', SALON.lic._fila, { ultimaConexion: ahora_().replace('T', ' ') }); } catch (e) {} }
  if (d && d.inicio) r.inicio = inicio_(u);
  return r;
}

// Todo lo que muestra la pantalla de Inicio en una sola consulta
function inicio_(u) {
  const h = hoy_(), hasta = Utilities.formatDate(new Date(Date.now() + 7 * 86400000), TZ, 'yyyy-MM-dd');
  const out = { citas: citas_(u, { desde: h + 'T00:00', hasta: hasta + 'T23:59' }), dash: null, aviso: null };
  if (u.rol === 'admin' || u.rol === 'recepcion') {
    const v = rows_('Ventas').filter(x => !x.anulada && String(x.fecha).slice(0, 10) === h);
    const g = rows_('Gastos').filter(x => !x.anulado && x.fechaGasto === h);
    out.dash = { kpi: { ingresos: r2_(v.reduce((a, x) => a + x.total, 0)), ventas: v.length, gastos: r2_(g.reduce((a, x) => a + x.monto, 0)) } };
  }
  if (u.rol === 'admin') out.aviso = resumenMeses_().find(m => !m.enCurso && m.pendiente > 0.009) || null;
  return out;
}

/* ===================== LICENCIA ===================== */

function licencia_() {
  if (MULTI_SALON) return SALON ? licSalon_(SALON.lic) : { estado: 'completa' };
  if (!DIAS_PRUEBA) return { estado: 'completa' };
  const pr = PropertiesService.getScriptProperties();
  if (pr.getProperty('LICENCIA') === 'activa') return { estado: 'completa' };
  let ini = pr.getProperty('PRUEBA_INICIO');
  if (!ini) { ini = String(Date.now()); pr.setProperty('PRUEBA_INICIO', ini); }
  const extra = Number(pr.getProperty('PRUEBA_EXTRA') || 0);
  const vence = Number(ini) + (DIAS_PRUEBA + extra) * 86400000;
  const resta = Math.ceil((vence - Date.now()) / 86400000);
  return { estado: resta > 0 ? 'prueba' : 'vencida', diasRestantes: Math.max(0, resta),
    vence: Utilities.formatDate(new Date(vence), TZ, 'yyyy-MM-dd'), contacto: CONTACTO_WA };
}

/* ===================== MULTI-SALÓN: LICENCIAS Y ACCESOS ===================== */

function master_() { return SpreadsheetApp.getActiveSpreadsheet(); }

function masterSheet_(name) {
  const m = master_();
  let s = m.getSheetByName(name);
  if (!s) {
    s = m.insertSheet(name);
    const h = SCHEMA_M[name];
    s.getRange(1, 1, 1, h.length).setValues([h]).setFontWeight('bold').setBackground('#8e3b63').setFontColor('#ffffff');
    s.setFrozenRows(1);
    h.forEach((k, i) => { if (['whatsapp','id','salonId','usuarioId','hojaId','registro','ultimaConexion'].indexOf(k) >= 0) s.getRange(2, i + 1, s.getMaxRows() - 1, 1).setNumberFormat('@'); });
    if (name === 'Accesos') { try { s.hideSheet(); } catch (e) {} }
    if (name === 'Licencias') {
      try {
        const regla = SpreadsheetApp.newDataValidation().requireValueInList(['Prueba', 'Activa', 'Vencida', 'Bloqueada'], true).build();
        s.getRange(2, h.indexOf('estado') + 1, s.getMaxRows() - 1, 1).setDataValidation(regla);
        s.getRange(2, h.indexOf('vencePrueba') + 1, s.getMaxRows() - 1, 1).setNumberFormat('yyyy-mm-dd');
      } catch (e) {}
    }
  }
  return s;
}

function mRows_(name) {
  const key = '_m_' + name;
  if (!MEMO[key]) {
    const s = masterSheet_(name), n = s.getLastRow(), h = SCHEMA_M[name];
    MEMO[key] = n < 2 ? [] : s.getRange(2, 1, n - 1, h.length).getValues().map((r, i) => {
      const o = { _fila: i + 2 };
      h.forEach((k, j) => {
        let v = r[j];
        if (v instanceof Date) v = Utilities.formatDate(v, TZ, k === 'vencePrueba' ? 'yyyy-MM-dd' : 'yyyy-MM-dd HH:mm');
        o[k] = (v === null || v === undefined) ? '' : (k === 'activo' ? !(v === false || v === 'false' || v === 'FALSE') : String(v));
      });
      return o;
    }).filter(o => o[h[0]] !== '');
  }
  return MEMO[key];
}

function mSet_(name, fila, campos) {
  const s = masterSheet_(name), h = SCHEMA_M[name];
  Object.keys(campos).forEach(k => { const c = h.indexOf(k); if (c >= 0) s.getRange(fila, c + 1).setValue(campos[k]); });
  delete MEMO['_m_' + name];
}

function mAppend_(name, o) {
  masterSheet_(name).appendRow(SCHEMA_M[name].map(k => (o[k] === undefined || o[k] === null) ? '' : o[k]));
  delete MEMO['_m_' + name];
}

// Normaliza el WhatsApp: solo números y con código de Honduras si vienen 8 dígitos
function waNorm_(w) {
  let d = String(w || '').replace(/\D/g, '');
  if (d.length === 8) d = '504' + d;
  return d;
}

function salonPorId_(id) {
  const c = CacheService.getScriptCache();
  try { const x = c.get('L_' + id); if (x) return JSON.parse(x); } catch (e) {}
  const l = mRows_('Licencias').find(x => x.id === id) || null;
  if (l) { try { c.put('L_' + id, JSON.stringify(l), 120); } catch (e) {} }
  return l;
}

function setSalon_(lic) {
  if (!SALON || SALON.id !== lic.id) delete MEMO._ss;
  SALON = { id: lic.id, hojaId: lic.hojaId, lic: lic };
}

function licSalon_(l) {
  const est = String(l.estado || '').trim().toLowerCase();
  if (est === 'activa') return { estado: 'completa' };
  if (est === 'bloqueada') return { estado: 'bloqueada', contacto: CONTACTO_WA };
  const vence = String(l.vencePrueba || '').slice(0, 10);
  const fin = /^\d{4}-\d{2}-\d{2}$/.test(vence) ? new Date(vence + 'T00:00:00').getTime() : 0;
  const resta = Math.ceil((fin - Date.now()) / 86400000);
  const r = { estado: resta > 0 ? 'prueba' : 'vencida', diasRestantes: Math.max(0, resta), vence: vence, contacto: CONTACTO_WA };
  const debe = r.estado === 'prueba' ? 'Prueba' : 'Vencida';
  if (l.estado !== debe && l._fila) {
    try { mSet_('Licencias', l._fila, { estado: debe }); CacheService.getScriptCache().remove('L_' + l.id); } catch (e) {}
    l.estado = debe;
  }
  return r;
}

function bloquearSiVence_() {
  const lic = licencia_();
  if (lic.estado === 'vencida' || lic.estado === 'bloqueada') {
    throw new Error('PRUEBA_VENCIDA|' + JSON.stringify({ contacto: CONTACTO_WA, nombre: SALON ? SALON.lic.salon : '', tipo: lic.estado }));
  }
}

function nuevoToken_(valor) {
  const token = Utilities.getUuid().replace(/-/g, '') + Utilities.getUuid().replace(/-/g, '');
  CacheService.getScriptCache().put('S_' + token, valor, SESION_SEG);
  return token;
}

function loginMulti_(d) {
  const c = CacheService.getScriptCache(), wa = waNorm_(d.whatsapp), kf = 'F_' + wa;
  const fallos = Number(c.get(kf) || 0);
  if (fallos >= 5) throw new Error('Demasiados intentos fallidos. Espera 10 minutos.');
  const falla = () => { c.put(kf, String(fallos + 1), 600); return new Error('WhatsApp o PIN incorrectos'); };
  const acc = mRows_('Accesos').find(x => String(x.whatsapp) === wa && x.activo);
  if (!acc) throw falla();
  const lic = salonPorId_(acc.salonId);
  if (!lic) throw falla();
  setSalon_(lic);
  const u = rows_('Usuarios').find(x => x.id === acc.usuarioId);
  if (!u || !u.activo || hash_(String(d.pin || ''), u.salt) !== u.hash) throw falla();
  c.remove(kf);
  bloquearSiVence_();
  return { token: nuevoToken_(lic.id + '|' + u.id), usuario: publico_(u) };
}

function carpeta_() {
  const it = DriveApp.getFoldersByName(CARPETA_DATOS);
  return it.hasNext() ? it.next() : DriveApp.createFolder(CARPETA_DATOS);
}

function registrar_(d) {
  if (!MULTI_SALON) throw new Error('Acción no válida');
  const salon = String(d.salon || '').trim().replace(/\s+/g, ' '), nombre = String(d.nombre || '').trim().replace(/\s+/g, ' ');
  const wa = waNorm_(d.whatsapp), pin = String(d.pin || '');
  if (!salon) throw new Error('Escribe el nombre de tu salón');
  if (!nombre) throw new Error('Escribe tu nombre');
  if (wa.length < 10) throw new Error('Escribe tu número de WhatsApp');
  if (!/^\d{4,6}$/.test(pin)) throw new Error('El PIN debe tener de 4 a 6 números');
  const lock = LockService.getScriptLock();
  lock.waitLock(30000);
  try {
    if (mRows_('Accesos').some(x => String(x.whatsapp) === wa)) throw new Error('Ese WhatsApp ya tiene una cuenta. Toca «Ya tengo cuenta» para ingresar.');
    const libro = SpreadsheetApp.create('Salón – ' + salon);
    try { DriveApp.getFileById(libro.getId()).moveTo(carpeta_()); } catch (e) {}
    const id = 'L' + Date.now().toString(36).toUpperCase() + Math.floor(Math.random() * 1296).toString(36).toUpperCase();
    const ahora = ahora_().replace('T', ' ');
    const lic = { id: id, salon: salon, duena: nombre, whatsapp: wa, registro: ahora,
      vencePrueba: Utilities.formatDate(new Date(Date.now() + DIAS_PRUEBA * 86400000), TZ, 'yyyy-MM-dd'),
      estado: 'Prueba', usuarios: 1, ultimaConexion: ahora, hojaId: libro.getId() };
    mAppend_('Licencias', lic);
    SALON = { id: id, hojaId: libro.getId(), lic: lic };
    MEMO._ss = libro;
    instalarSalon_({ nombre: salon, telefono: wa.length === 11 && wa.indexOf('504') === 0 ? wa.slice(3, 7) + '-' + wa.slice(7) : wa,
      admin: { usuario: wa, nombre: nombre, pin: pin } });
    const adm = rows_('Usuarios').find(x => x.usuario === wa);
    mAppend_('Accesos', { whatsapp: wa, salonId: id, usuarioId: adm.id, activo: true });
    return { token: nuevoToken_(id + '|' + adm.id), usuario: publico_(adm) };
  } finally { lock.releaseLock(); }
}

// Ejecútala desde el editor de Apps Script cuando el cliente pague
function activarLicencia() {
  PropertiesService.getScriptProperties().setProperty('LICENCIA', 'activa');
  Logger.log('Sistema activado: licencia completa');
}

// Agrega días a la prueba (por defecto 7)
function extenderPrueba(dias) {
  const pr = PropertiesService.getScriptProperties();
  const n = Number(dias) || 7;
  pr.setProperty('PRUEBA_EXTRA', String(Number(pr.getProperty('PRUEBA_EXTRA') || 0) + n));
  Logger.log('Prueba extendida ' + n + ' días');
}

function guardar_(u, d) {
  const ent = d.entidad;
  if (ent === 'Config') { req_(u, ['admin']); return guardarConfig_(d.registro); }
  if (!ESCRITURA[ent]) throw new Error('Entidad no válida');
  req_(u, ESCRITURA[ent]);
  const r = Object.assign({}, d.registro || {});
  if (SCHEMA[ent].indexOf('nombre') >= 0 && !r.id && !String(r.nombre || '').trim()) throw new Error('El nombre es obligatorio');
  if (!r.id) {
    if (SCHEMA[ent].indexOf('creado') >= 0) r.creado = ahora_();
    if (SCHEMA[ent].indexOf('activo') >= 0 && r.activo === undefined) r.activo = true;
  }
  if (ent === 'Productos' && r.codigo) {
    if (rows_('Productos').some(p => p.codigo && String(p.codigo) === String(r.codigo) && p.id !== r.id)) throw new Error('Ya existe un producto con ese código');
  }
  if (ent === 'PlanesTratamiento' && !r.id) {
    const t = rows_('Tratamientos').find(x => x.id === r.tratamientoId);
    if (!t) throw new Error('Selecciona un tratamiento');
    if (!r.clienteId) throw new Error('Selecciona un cliente');
    r.sesionesTotales = Number(r.sesionesTotales) || t.sesiones || 1;
    r.sesionesUsadas = Number(r.sesionesUsadas) || 0;
    r.precio = (r.precio === undefined || r.precio === '') ? t.precio : Number(r.precio);
    r.pagado = Number(r.pagado) || 0;
    r.estado = r.estado || 'activo';
    r.fechaInicio = r.fechaInicio || hoy_();
  }
  return upsert_(ent, r);
}

function eliminar_(u, d) {
  req_(u, ['admin']);
  const permitidas = ['Clientes','Servicios','Tratamientos','Productos','PlanesTratamiento','Citas','Promociones','FichaTecnica'];
  if (d.entidad === 'FichaTecnica') { const f = rows_('FichaTecnica').find(x => x.id === d.id); if (f) ['fotoAntes','fotoDespues'].forEach(k => { if (f[k]) { try { DriveApp.getFileById(f[k]).setTrashed(true); } catch (e) {} } }); }
  if (permitidas.indexOf(d.entidad) < 0) throw new Error('No se puede eliminar este tipo de registro');
  if (d.entidad === 'Citas') {
    const c = rows_('Citas').find(x => x.id === d.id);
    if (c && c.estado === 'completada') aplicarEstado_(c, 'cancelada'); // devuelve la sesión al plan antes de borrar
  }
  deleteRow_(d.entidad, d.id);
  return true;
}

/* ===================== CITAS ===================== */

function nombreRef_(tipo, refId) {
  if (!refId) return '';
  const l = rows_(tipo === 'tratamiento' ? 'Tratamientos' : 'Servicios');
  const x = l.find(i => i.id === refId);
  return x ? x.nombre : '';
}

function citas_(u, d) {
  let l = rows_('Citas');
  if (d.desde) l = l.filter(c => c.fin >= d.desde);
  if (d.hasta) l = l.filter(c => c.inicio <= d.hasta);
  if (u.rol === 'estilista') l = l.filter(c => c.estilistaId === u.id);
  return l;
}

function guardarCita_(u, d) {
  const r = Object.assign({}, d.registro || {});
  const todas = rows_('Citas');
  const prev = r.id ? todas.find(c => c.id === r.id) : null;
  if (r.id && !prev) throw new Error('La cita ya no existe');
  if (u.rol === 'estilista') {
    if (prev && prev.estilistaId !== u.id) throw new Error('Solo puedes modificar tus propias citas');
    r.estilistaId = u.id;
  }
  if (!r.clienteId) throw new Error('Selecciona un cliente');
  if (!r.estilistaId) throw new Error('Selecciona un estilista');
  if (!r.inicio || !r.fin || r.fin <= r.inicio) throw new Error('El horario de la cita no es válido');
  if (prev && (prev.estado === 'completada')) throw new Error('No se puede modificar una cita completada');

  const choque = todas.find(c => c.id !== r.id && c.estilistaId === r.estilistaId &&
    NO_OCUPA.indexOf(c.estado) < 0 && r.inicio < c.fin && r.fin > c.inicio);
  if (choque && !d.forzar) {
    throw new Error('CHOQUE|' + choque.titulo + ' (' + choque.inicio.slice(11, 16) + '–' + choque.fin.slice(11, 16) + ')');
  }

  if (r.planId) {
    const p = rows_('PlanesTratamiento').find(x => x.id === r.planId);
    if (!p) throw new Error('El plan de tratamiento no existe');
    if (p.clienteId !== r.clienteId) throw new Error('El plan no pertenece a este cliente');
    if (p.estado !== 'activo' && (!prev || prev.planId !== r.planId)) throw new Error('El plan de tratamiento no está activo');
    r.tipo = 'tratamiento';
    r.refId = p.tratamientoId;
  }

  let nombreServicio = nombreRef_(r.tipo, r.refId);
  if (r.planId || r.tipo === 'tratamiento') {
    r.servicios = '';
  } else {
    // Una cita puede llevar varios servicios
    let lista = r.servicios;
    if (typeof lista === 'string') { try { lista = lista ? JSON.parse(lista) : []; } catch (e) { lista = []; } }
    if (!Array.isArray(lista) || !lista.length) lista = r.refId ? [{ id: r.refId }] : [];
    const svs = rows_('Servicios');
    lista = lista.map(z => {
      const id = typeof z === 'string' ? z : z.id, x = svs.find(v => v.id === id);
      if (!x) throw new Error('Uno de los servicios ya no existe');
      return { id: x.id, nombre: x.nombre, duracion: Number(z.duracion) || x.duracion,
        precio: z.precio === undefined || z.precio === '' ? x.precio : r2_(z.precio) };
    });
    if (!lista.length) throw new Error('Agrega al menos un servicio');
    r.tipo = 'servicio'; r.refId = lista[0].id; r.servicios = JSON.stringify(lista);
    nombreServicio = lista.map(z => z.nombre).join(' + ');
  }
  const cli = rows_('Clientes').find(x => x.id === r.clienteId);
  r.titulo = (cli ? cli.nombre : 'Cliente') + ' · ' + (nombreServicio || 'Cita');
  r.precio = Number(r.precio) || 0;
  r.estado = prev ? prev.estado : 'pendiente';
  if (!prev) { r.creadoPor = u.id; r.creado = ahora_(); }
  return upsert_('Citas', r);
}

function estadoCita_(u, d) {
  if (ESTADOS.indexOf(d.estado) < 0) throw new Error('Estado no válido');
  const c = rows_('Citas').find(x => x.id === d.id);
  if (!c) throw new Error('La cita no existe');
  if (u.rol === 'estilista' && c.estilistaId !== u.id) throw new Error('Solo puedes modificar tus propias citas');
  return aplicarEstado_(c, d.estado);
}

function aplicarEstado_(c, estado) {
  if (c.estado === estado) return c;
  if (c.planId) {
    const delta = (estado === 'completada' ? 1 : 0) - (c.estado === 'completada' ? 1 : 0);
    if (delta) {
      const p = rows_('PlanesTratamiento').find(x => x.id === c.planId);
      if (p) {
        p.sesionesUsadas = Math.max(0, (p.sesionesUsadas || 0) + delta);
        if (p.estado !== 'cancelado') p.estado = p.sesionesUsadas >= p.sesionesTotales ? 'completado' : 'activo';
        upsert_('PlanesTratamiento', p);
      }
    }
  }
  c.estado = estado;
  return upsert_('Citas', c);
}

/* ===================== VENTAS ===================== */

function venta_(u, d) {
  const items = (d.items || []).map(i => ({
    tipo: String(i.tipo || 'servicio'), refId: String(i.refId || ''), descripcion: String(i.descripcion || ''),
    cantidad: Math.max(1, Number(i.cantidad) || 1), precio: Math.max(0, Number(i.precio) || 0)
  }));
  if (!items.length) throw new Error('El ticket está vacío');
  if (items.some(i => i.tipo === 'tratamiento' || i.tipo === 'abono') && !d.clienteId) {
    throw new Error('Para vender tratamientos o abonar a un plan selecciona un cliente registrado');
  }
  const cfg = config_();
  const tasa = Number(cfg.isv) || 0;
  const incl = cfg.preciosConISV !== 'no';

  // Validar stock
  const prods = rows_('Productos'), pm = {};
  prods.forEach(p => { pm[p.id] = p; });
  const pedido = {};
  items.forEach(i => { if (i.tipo === 'producto') pedido[i.refId] = (pedido[i.refId] || 0) + i.cantidad; });
  Object.keys(pedido).forEach(id => {
    const p = pm[id];
    if (!p) throw new Error('Producto no encontrado');
    if (p.stock < pedido[id]) throw new Error('Stock insuficiente de ' + p.nombre + ' (disponible: ' + p.stock + ')');
  });

  const subtotal = items.reduce((a, i) => a + i.cantidad * i.precio, 0);
  const descuento = Math.min(Math.max(0, Number(d.descuento) || 0), subtotal);
  const base = subtotal - descuento;
  let isv, total;
  if (incl) { total = base; isv = tasa ? base - base / (1 + tasa) : 0; }
  else { isv = base * tasa; total = base + isv; }
  const factor = subtotal ? base / subtotal : 1;

  const venta = {
    id: newId_('Ventas'), fecha: ahora_(), clienteId: d.clienteId || '', usuarioId: u.id,
    subtotal: r2_(subtotal), descuento: r2_(descuento), isv: r2_(isv), total: r2_(total),
    metodo: d.metodo || 'Efectivo', citaId: d.citaId || '', anulada: false, nota: d.nota || ''
  };
  const detalle = items.map(i => ({
    id: newId_('VentaDetalle') + Math.floor(Math.random() * 99), ventaId: venta.id, tipo: i.tipo, refId: i.refId,
    descripcion: i.descripcion, cantidad: i.cantidad, precio: r2_(i.precio), total: r2_(i.cantidad * i.precio)
  }));
  appendRows_('Ventas', [venta]);
  appendRows_('VentaDetalle', detalle);

  // Descontar inventario
  Object.keys(pedido).forEach(id => { upsert_('Productos', { id: id, stock: pm[id].stock - pedido[id] }); });

  // Paquetes de tratamiento y abonos
  const trats = rows_('Tratamientos');
  items.forEach(i => {
    if (i.tipo === 'tratamiento') {
      const t = trats.find(x => x.id === i.refId);
      if (!t) return;
      for (let n = 0; n < i.cantidad; n++) {
        upsert_('PlanesTratamiento', {
          clienteId: d.clienteId, tratamientoId: t.id, sesionesTotales: t.sesiones || 1, sesionesUsadas: 0,
          precio: r2_(i.precio), pagado: r2_(i.precio * factor), estado: 'activo', fechaInicio: hoy_(), notas: 'Venta ' + venta.id
        });
      }
    } else if (i.tipo === 'abono') {
      const p = rows_('PlanesTratamiento').find(x => x.id === i.refId);
      if (p) upsert_('PlanesTratamiento', { id: p.id, pagado: r2_(p.pagado + i.precio * i.cantidad * factor) });
    }
  });

  // Cerrar la cita asociada
  if (d.citaId) {
    const c = rows_('Citas').find(x => x.id === d.citaId);
    if (c && c.estado !== 'completada' && NO_OCUPA.indexOf(c.estado) < 0) aplicarEstado_(c, 'completada');
  }
  return { venta: venta, detalle: detalle };
}

function rango_(d) {
  const desde = d.desde ? (d.desde.length === 10 ? d.desde + 'T00:00' : d.desde) : '';
  const hasta = d.hasta ? (d.hasta.length === 10 ? d.hasta + 'T23:59' : d.hasta) : '';
  return { desde: desde, hasta: hasta };
}

function ventas_(u, d) {
  const r = rango_(d);
  let v = rows_('Ventas').filter(x => (!r.desde || x.fecha >= r.desde) && (!r.hasta || x.fecha <= r.hasta));
  if (u.rol === 'estilista') v = v.filter(x => x.usuarioId === u.id);
  const ids = {};
  v.forEach(x => { x.detalle = []; ids[x.id] = x; });
  rows_('VentaDetalle').forEach(det => { if (ids[det.ventaId]) ids[det.ventaId].detalle.push(det); });
  return v.sort((a, b) => a.fecha < b.fecha ? 1 : -1);
}

function anularVenta_(u, d) {
  req_(u, ['admin']);
  const v = rows_('Ventas').find(x => x.id === d.id);
  if (!v) throw new Error('La venta no existe');
  if (v.anulada) throw new Error('La venta ya está anulada');
  const det = rows_('VentaDetalle').filter(x => x.ventaId === v.id);
  const prods = rows_('Productos');
  det.forEach(i => {
    if (i.tipo === 'producto') {
      const p = prods.find(x => x.id === i.refId);
      if (p) { p.stock += i.cantidad; upsert_('Productos', { id: p.id, stock: p.stock }); }
    } else if (i.tipo === 'abono') {
      const p = rows_('PlanesTratamiento').find(x => x.id === i.refId);
      if (p) upsert_('PlanesTratamiento', { id: p.id, pagado: Math.max(0, r2_(p.pagado - i.total)) });
    }
  });
  rows_('PlanesTratamiento').filter(p => p.notas === 'Venta ' + v.id && p.sesionesUsadas === 0)
    .forEach(p => upsert_('PlanesTratamiento', { id: p.id, estado: 'cancelado', notas: 'Anulado (venta ' + v.id + ')' }));
  upsert_('Ventas', { id: v.id, anulada: true, nota: (v.nota ? v.nota + ' · ' : '') + 'Anulada por ' + u.nombre + ' ' + ahora_() });
  return true;
}

/* ===================== GASTOS ===================== */

// Categorías, detalles y proveedores ya usados, ordenados por frecuencia (para sugerirlos)
function catalogoGastos_() {
  const m = {};
  rows_('Gastos').filter(g => !g.anulado).forEach(g => {
    const c = String(g.categoria || '').trim();
    if (!c) return;
    const x = m[c] || (m[c] = { usos: 0, ultimo: '', det: {}, prov: {}, montos: {}, fdet: {} });
    x.usos++;
    if (g.fechaGasto > x.ultimo) x.ultimo = g.fechaGasto;
    const d = String(g.detalle || '').trim();
    if (d) {
      x.det[d] = (x.det[d] || 0) + 1;
      if (!x.fdet[d] || g.fechaGasto >= x.fdet[d]) { x.fdet[d] = g.fechaGasto; x.montos[d] = g.monto; }
    }
    const p = String(g.proveedor || '').trim();
    if (p) x.prov[p] = (x.prov[p] || 0) + 1;
  });
  const orden = o => Object.keys(o).sort((a, b) => o[b] - o[a] || a.localeCompare(b));
  return Object.keys(m).map(k => ({ categoria: k, usos: m[k].usos, ultimo: m[k].ultimo,
    detalles: orden(m[k].det), proveedores: orden(m[k].prov), montos: m[k].montos }))
    .sort((a, b) => b.usos - a.usos || a.categoria.localeCompare(b.categoria));
}

function gastos_(u, d) {
  req_(u, ['admin','recepcion']);
  const desde = String(d.desde || '').slice(0, 10), hasta = String(d.hasta || '').slice(0, 10);
  return rows_('Gastos').filter(g => (!desde || g.fechaGasto >= desde) && (!hasta || g.fechaGasto <= hasta))
    .sort((a, b) => (a.fechaGasto + a.creado) < (b.fechaGasto + b.creado) ? 1 : -1);
}

function guardarGasto_(u, d) {
  req_(u, ['admin','recepcion']);
  const r = Object.assign({}, d.registro || {});
  const prev = r.id ? rows_('Gastos').find(g => g.id === r.id) : null;
  if (r.id && !prev) throw new Error('El gasto ya no existe');
  if (prev && prev.anulado) throw new Error('No se puede modificar un gasto anulado');
  if (prev && u.rol !== 'admin' && prev.usuarioId !== u.id) throw new Error('Solo puedes modificar los gastos que registraste');
  ['categoria','detalle','proveedor','nota','metodo'].forEach(k => { r[k] = String(r[k] || '').trim().replace(/\s+/g, ' '); });
  if (!r.categoria) throw new Error('Selecciona o escribe una categoría');
  if (!r.detalle) throw new Error('Escribe el detalle del gasto');
  r.monto = r2_(r.monto);
  if (!(r.monto > 0)) throw new Error('El monto debe ser mayor a cero');
  if (!/^\d{4}-\d{2}-\d{2}$/.test(String(r.fechaGasto || ''))) r.fechaGasto = hoy_();
  if (r.fechaGasto > hoy_()) throw new Error('La fecha del gasto no puede ser futura');
  // Unificar con lo ya usado (evita "Agua" y "agua" como cosas distintas)
  const cats = catalogoGastos_();
  const cat = cats.find(c => c.categoria.toLowerCase() === r.categoria.toLowerCase());
  if (cat) {
    r.categoria = cat.categoria;
    const det = cat.detalles.find(x => x.toLowerCase() === r.detalle.toLowerCase());
    if (det) r.detalle = det;
  }
  const prov = [].concat.apply([], cats.map(c => c.proveedores)).find(x => r.proveedor && x.toLowerCase() === r.proveedor.toLowerCase());
  if (prov) r.proveedor = prov;
  r.metodo = r.metodo || 'Efectivo';
  if (!prev) { r.usuarioId = u.id; r.creado = ahora_(); r.anulado = false; }
  else { delete r.usuarioId; delete r.creado; delete r.anulado; }
  const g = upsert_('Gastos', r);
  return { gasto: g, cats: catalogoGastos_() };
}

function anularGasto_(u, d) {
  req_(u, ['admin']);
  const g = rows_('Gastos').find(x => x.id === d.id);
  if (!g) throw new Error('El gasto no existe');
  if (g.anulado) throw new Error('El gasto ya está anulado');
  upsert_('Gastos', { id: g.id, anulado: true, nota: (g.nota ? g.nota + ' · ' : '') + 'Anulado por ' + u.nombre + ' ' + ahora_() });
  return { cats: catalogoGastos_() };
}

/* ===================== DIARIO, HISTORIAL Y UTILIDADES ===================== */

// Resumen por mes: ingresos (ventas), ISV, gastos, utilidad y cuánto de ella ya tiene destino
function resumenMeses_() {
  const m = {};
  const mes = k => m[k] || (m[k] = { mes: k, ingresos: 0, isv: 0, gastos: 0, ventas: 0, nGastos: 0, asignado: 0, cuentas: 0, pagos: 0 });
  rows_('Ventas').forEach(v => { if (v.anulada || !v.fecha) return; const x = mes(v.fecha.slice(0, 7)); x.ingresos += v.total; x.isv += v.isv; x.ventas++; });
  rows_('Gastos').forEach(g => { if (g.anulado || !g.fechaGasto) return; const x = mes(g.fechaGasto.slice(0, 7)); x.gastos += g.monto; x.nGastos++; });
  rows_('Distribuciones').forEach(d => { if (d.anulado) return; const x = mes(d.mes); x.asignado += d.monto; if (d.tipo === 'pago') x.pagos += d.monto; else x.cuentas += d.monto; });
  const actual = hoy_().slice(0, 7);
  return Object.keys(m).sort().reverse().map(k => {
    const x = m[k];
    ['ingresos','isv','gastos','asignado','cuentas','pagos'].forEach(f => { x[f] = r2_(x[f]); });
    x.utilidad = r2_(x.ingresos - x.isv - x.gastos);
    x.pendiente = r2_(Math.max(0, x.utilidad - x.asignado));
    x.enCurso = k >= actual;
    return x;
  });
}

function historial_(u) {
  req_(u, ['admin','recepcion']);
  const dist = rows_('Distribuciones');
  const activos = dist.filter(d => !d.anulado);
  const uso = t => { const n = {}; activos.filter(d => d.tipo === t).forEach(d => { n[d.destino] = (n[d.destino] || 0) + 1; }); return Object.keys(n).sort((a, b) => n[b] - n[a]); };
  const total = t => { const n = {}; activos.filter(d => d.tipo === t).forEach(d => { n[d.destino] = r2_((n[d.destino] || 0) + d.monto); }); return Object.keys(n).map(k => ({ destino: k, total: n[k] })).sort((a, b) => b.total - a.total); };
  return {
    meses: resumenMeses_(),
    distribuciones: dist.sort((a, b) => a.creado < b.creado ? 1 : -1),
    cuentas: total('cuenta'), pagos: total('pago'),
    destinos: { cuenta: uso('cuenta'), pago: uso('pago') }
  };
}

function movimientos_(u, d) {
  req_(u, ['admin','recepcion']);
  const mes = /^\d{4}-\d{2}$/.test(String(d.mes || '')) ? d.mes : hoy_().slice(0, 7);
  const usuarios = {}, clientes = {};
  rows_('Usuarios').forEach(x => { usuarios[x.id] = x.nombre; });
  rows_('Clientes').forEach(x => { clientes[x.id] = x.nombre; });
  const ventas = rows_('Ventas').filter(v => String(v.fecha).slice(0, 7) === mes);
  const det = {};
  ventas.forEach(v => { det[v.id] = []; });
  rows_('VentaDetalle').forEach(x => { if (det[x.ventaId]) det[x.ventaId].push(x.descripcion + (x.cantidad > 1 ? ' ×' + x.cantidad : '')); });
  const mov = ventas.map(v => ({
    id: v.id, fecha: v.fecha, tipo: 'ingreso', concepto: det[v.id].join(', ') || 'Venta', categoria: 'Venta',
    tercero: v.clienteId ? (clientes[v.clienteId] || 'Cliente') : 'Consumidor final', metodo: v.metodo,
    usuario: usuarios[v.usuarioId] || '', monto: v.total, isv: v.isv, anulado: v.anulada, nota: v.nota
  }));
  rows_('Gastos').filter(g => String(g.fechaGasto).slice(0, 7) === mes).forEach(g => mov.push({
    id: g.id, fecha: g.fechaGasto + 'T' + (String(g.creado).slice(0, 10) === g.fechaGasto ? String(g.creado).slice(11, 16) : '00:00'),
    tipo: 'gasto', concepto: g.detalle, categoria: g.categoria, tercero: g.proveedor, metodo: g.metodo,
    usuario: usuarios[g.usuarioId] || '', monto: g.monto, isv: 0, anulado: g.anulado, nota: g.nota
  }));
  mov.sort((a, b) => a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : 0);
  const resumen = resumenMeses_().find(x => x.mes === mes) ||
    { mes: mes, ingresos: 0, isv: 0, gastos: 0, ventas: 0, nGastos: 0, asignado: 0, cuentas: 0, pagos: 0, utilidad: 0, pendiente: 0, enCurso: mes >= hoy_().slice(0, 7) };
  return { mes: mes, movimientos: mov, resumen: resumen, distribuciones: rows_('Distribuciones').filter(x => x.mes === mes && !x.anulado) };
}

function guardarDistribucion_(u, d) {
  req_(u, ['admin']);
  const r = Object.assign({}, d.registro || {});
  delete r.id;
  r.mes = String(r.mes || '');
  if (!/^\d{4}-\d{2}$/.test(r.mes)) throw new Error('Mes no válido');
  if (r.mes >= hoy_().slice(0, 7)) throw new Error('Solo se puede decidir la utilidad de meses ya cerrados');
  r.tipo = r.tipo === 'pago' ? 'pago' : 'cuenta';
  ['destino','detalle','nota'].forEach(k => { r[k] = String(r[k] || '').trim().replace(/\s+/g, ' '); });
  if (!r.destino) throw new Error(r.tipo === 'pago' ? 'Indica qué se va a pagar' : 'Indica a qué cuenta va el dinero');
  r.monto = r2_(r.monto);
  if (!(r.monto > 0)) throw new Error('El monto debe ser mayor a cero');
  const m = resumenMeses_().find(x => x.mes === r.mes);
  if (!m || m.utilidad <= 0) throw new Error('Ese mes no dejó utilidad para asignar');
  if (r.monto > m.pendiente + 0.001) throw new Error('El monto supera la utilidad disponible de ese mes (' + m.pendiente.toFixed(2) + ')');
  const igual = rows_('Distribuciones').find(x => !x.anulado && x.tipo === r.tipo && x.destino.toLowerCase() === r.destino.toLowerCase());
  if (igual) r.destino = igual.destino;
  r.usuarioId = u.id; r.creado = ahora_(); r.anulado = false;
  upsert_('Distribuciones', r);
  return historial_(u);
}

function anularDistribucion_(u, d) {
  req_(u, ['admin']);
  const x = rows_('Distribuciones').find(z => z.id === d.id);
  if (!x) throw new Error('El registro no existe');
  if (x.anulado) throw new Error('Ya estaba anulado');
  upsert_('Distribuciones', { id: x.id, anulado: true, nota: (x.nota ? x.nota + ' · ' : '') + 'Anulado por ' + u.nombre + ' ' + ahora_() });
  return historial_(u);
}

/* ===================== REPORTES ===================== */

function dashboard_(u, d) {
  req_(u, ['admin','recepcion']);
  const r = rango_({ desde: d.desde || hoy_(), hasta: d.hasta || hoy_() });
  const ventas = rows_('Ventas').filter(v => !v.anulada && v.fecha >= r.desde && v.fecha <= r.hasta);
  const ids = new Set(ventas.map(v => v.id));
  const det = rows_('VentaDetalle').filter(x => ids.has(x.ventaId));
  const todas = rows_('Citas');
  const citaMap = {};
  todas.forEach(c => { citaMap[c.id] = c; });
  const citas = todas.filter(c => c.inicio >= r.desde && c.inicio <= r.hasta);
  const usuarios = rows_('Usuarios');

  const k = { ingresos: 0, ventas: ventas.length, ticket: 0, isv: 0, descuentos: 0, citas: citas.length,
    completadas: 0, canceladas: 0, noAsistio: 0, pendientes: 0, servicios: 0, productos: 0, tratamientos: 0, abonos: 0, clientesNuevos: 0,
    gastos: 0, utilidad: 0 };
  const porDia = {}, porMetodo = {}, porEst = {}, top = {}, porEstado = {};
  const est = id => {
    if (!porEst[id]) {
      const x = usuarios.find(z => z.id === id);
      porEst[id] = { id: id, nombre: x ? x.nombre : '—', color: x ? x.color : '', citas: 0, completadas: 0, ingresos: 0 };
    }
    return porEst[id];
  };

  ventas.forEach(v => {
    k.ingresos += v.total; k.isv += v.isv; k.descuentos += v.descuento;
    const dia = v.fecha.slice(0, 10);
    porDia[dia] = (porDia[dia] || 0) + v.total;
    porMetodo[v.metodo] = (porMetodo[v.metodo] || 0) + v.total;
    const c = v.citaId && citaMap[v.citaId];
    est(c ? c.estilistaId : v.usuarioId).ingresos += v.total;
  });
  det.forEach(i => {
    const campo = { servicio: 'servicios', producto: 'productos', tratamiento: 'tratamientos', abono: 'abonos' }[i.tipo] || 'servicios';
    k[campo] += i.total;
    const key = i.tipo === 'abono' ? 'abono' : i.tipo + ':' + (i.refId || i.descripcion);
    if (!top[key]) top[key] = { tipo: i.tipo, descripcion: i.tipo === 'abono' ? 'Abonos a planes' : i.descripcion, cantidad: 0, total: 0 };
    top[key].cantidad += i.cantidad; top[key].total += i.total;
  });
  citas.forEach(c => {
    porEstado[c.estado] = (porEstado[c.estado] || 0) + 1;
    const e = est(c.estilistaId);
    e.citas++;
    if (c.estado === 'completada') { e.completadas++; k.completadas++; }
    if (c.estado === 'cancelada') k.canceladas++;
    if (c.estado === 'no_asistio') k.noAsistio++;
    if (c.estado === 'pendiente') k.pendientes++;
  });
  k.clientesNuevos = rows_('Clientes').filter(c => c.creado >= r.desde && c.creado <= r.hasta).length;
  k.ticket = ventas.length ? k.ingresos / ventas.length : 0;
  const gastosPorDia = {}, gastosPorCategoria = {};
  rows_('Gastos').filter(g => !g.anulado && g.fechaGasto >= r.desde.slice(0, 10) && g.fechaGasto <= r.hasta.slice(0, 10)).forEach(g => {
    k.gastos += g.monto;
    gastosPorDia[g.fechaGasto] = (gastosPorDia[g.fechaGasto] || 0) + g.monto;
    gastosPorCategoria[g.categoria] = (gastosPorCategoria[g.categoria] || 0) + g.monto;
  });
  k.utilidad = k.ingresos - k.isv - k.gastos; // ventas sin ISV menos gastos
  Object.keys(k).forEach(x => { k[x] = r2_(k[x]); });

  return {
    kpi: k, porDia: porDia, porMetodo: porMetodo, porEstado: porEstado, gastosPorDia: gastosPorDia,
    gastosPorCategoria: Object.keys(gastosPorCategoria).map(c => ({ categoria: c, total: r2_(gastosPorCategoria[c]) })).sort((a, b) => b.total - a.total),
    top: Object.keys(top).map(x => top[x]).sort((a, b) => b.total - a.total).slice(0, 10),
    estilistas: Object.keys(porEst).map(x => porEst[x]).sort((a, b) => b.ingresos - a.ingresos)
  };
}

function historialCliente_(u, d) {
  req_(u, ['admin','recepcion']);
  const citas = rows_('Citas').filter(c => c.clienteId === d.id).sort((a, b) => a.inicio < b.inicio ? 1 : -1);

function carpetaFotos_() {
  const nombre = MULTI_SALON && SALON ? 'Fotos de fichas – ' + SALON.lic.salon + ' (' + SALON.id + ')' : 'Salón – Fotos de fichas';
  const it = DriveApp.getFoldersByName(nombre);
  return it.hasNext() ? it.next() : DriveApp.createFolder(nombre);
}

function guardarFoto_(dataUrl, nombre) {
  const m = /^data:(image\/(?:jpeg|png|webp));base64,(.+)$/.exec(String(dataUrl || ''));
  if (!m) throw new Error('La foto no es válida');
  if (m[2].length > 2800000) throw new Error('La foto es muy pesada');
  const blob = Utilities.newBlob(Utilities.base64Decode(m[2]), m[1], nombre);
  return carpetaFotos_().createFile(blob).getId();
}

function guardarFicha_(u, d) {
  const r = Object.assign({}, d.registro || {});
  if (!r.clienteId || !rows_('Clientes').some(c => c.id === r.clienteId)) throw new Error('Selecciona un cliente');
  if (!String(r.servicio || '').trim() && !String(r.formula || '').trim() && !String(r.notas || '').trim() && !d.fotoAntes && !d.fotoDespues) throw new Error('Escribe algo en la ficha o agrega una foto');
  const prev = r.id ? rows_('FichaTecnica').find(x => x.id === r.id) : null;
  if (r.id && !prev) throw new Error('El registro ya no existe');
  if (prev && u.rol === 'estilista' && prev.usuarioId !== u.id) throw new Error('Solo puedes editar tus propios registros');
  r.fecha = String(r.fecha || hoy_()).slice(0, 10);
  ['Antes', 'Despues'].forEach(k => {
    const campo = 'foto' + k, dato = d[campo];
    if (dato === 'quitar') r[campo] = '';
    else if (dato) r[campo] = guardarFoto_(dato, 'ficha-' + r.clienteId + '-' + k.toLowerCase() + '-' + Date.now() + '.jpg');
    else r[campo] = prev ? prev[campo] : '';
    if (prev && prev[campo] && prev[campo] !== r[campo]) { try { DriveApp.getFileById(prev[campo]).setTrashed(true); } catch (e) {} }
  });
  if (!prev) { r.usuarioId = u.id; r.creado = ahora_(); if (!r.estilistaId) r.estilistaId = u.id; }
  return upsert_('FichaTecnica', r);
}

function fotoFicha_(u, d) {
  const id = String(d.id || '');
  if (!id || !rows_('FichaTecnica').some(f => f.fotoAntes === id || f.fotoDespues === id)) throw new Error('Foto no encontrada');
  const b = DriveApp.getFileById(id).getBlob();
  return 'data:' + (b.getContentType() || 'image/jpeg') + ';base64,' + Utilities.base64Encode(b.getBytes());
}

function fichaCliente_(u, d) {
  return rows_('FichaTecnica').filter(f => f.clienteId === d.id).sort((a, b) => a.fecha < b.fecha ? 1 : a.fecha > b.fecha ? -1 : (a.creado < b.creado ? 1 : -1));
}

function reservaSalon_(d) {

  }

}

function estilistasReserva_() {
  const us = rows_('Usuarios').filter(x => x.activo);
  const est = us.filter(x => x.rol === 'estilista');
  return (est.length ? est : us).map(x => ({ id: x.id, nombre: x.nombre, color: x.color }));
}

function reservaInfo_(d) {
  const cfg = reservaSalon_(d);
  return {
    nombre: cfg.nombre, logo: cfg.logo, tema: cfg.tema, telefono: cfg.telefono, direccion: cfg.direccion, moneda: cfg.moneda,
    apertura: cfg.apertura, cierre: cfg.cierre, intervalo: Number(cfg.intervalo) || 15, dias: String(cfg.reservaDias || '1,2,3,4,5,6'),
    mensaje: cfg.reservaMensaje || '', anticipacion: Number(cfg.reservaHoras || 2), hoy: hoy_(), ahora: ahora_(),
    servicios: rows_('Servicios').filter(s => s.activo).map(s => ({ id: s.id, nombre: s.nombre, categoria: s.categoria, duracion: s.duracion, precio: s.precio })),
    estilistas: estilistasReserva_()
  };
}

function minutos_(hhmm) { const p = String(hhmm || '00:00').split(':'); return Number(p[0]) * 60 + Number(p[1] || 0); }
function hhmm_(m) { return ('0' + Math.floor(m / 60)).slice(-2) + ':' + ('0' + (m % 60)).slice(-2); }

function horasLibres_(cfg, fecha, dur, estilistaId) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(String(fecha))) throw new Error('Fecha no válida');
  const h = hoy_();
  const lim = Utilities.formatDate(new Date(Date.now() + 60 * 86400000), TZ, 'yyyy-MM-dd');
  if (fecha < h || fecha > lim) return [];
  const dia = new Date(fecha + 'T12:00:00').getDay();
  if (String(cfg.reservaDias || '1,2,3,4,5,6').split(',').indexOf(String(dia)) < 0) return [];
  const paso = Number(cfg.intervalo) || 15, ini = minutos_(cfg.apertura), fin = minutos_(cfg.cierre);
  const est = estilistasReserva_().filter(e => !estilistaId || e.id === estilistaId);
  const citas = rows_('Citas').filter(c => c.inicio.slice(0, 10) === fecha && NO_OCUPA.indexOf(c.estado) < 0);
  const ahoraMin = fecha === h ? minutos_(ahora_().slice(11, 16)) + (Number(cfg.reservaHoras || 2) * 60) : -1;
  const out = [];
  for (let m = ini; m + dur <= fin; m += paso) {
    if (m < ahoraMin) continue;
    const a = fecha + 'T' + hhmm_(m), b = fecha + 'T' + hhmm_(m + dur);
    const libres = est.filter(e => !citas.some(c => c.estilistaId === e.id && a < c.fin && b > c.inicio)).map(e => e.id);
    if (libres.length) out.push({ hora: hhmm_(m), estilistas: libres });
  }
  return out;
}

function serviciosReserva_(ids) {
  const svs = rows_('Servicios').filter(s => s.activo);
  const l = (Array.isArray(ids) ? ids : []).map(id => svs.find(s => s.id === id)).filter(Boolean);
  if (!l.length) throw new Error('Elige al menos un servicio');
  if (l.length > 5) throw new Error('Puedes reservar hasta 5 servicios a la vez');
  return l;
}

function reservaHoras_(d) {
  const cfg = reservaSalon_(d);
  const l = serviciosReserva_(d.servicios);
  return horasLibres_(cfg, d.fecha, l.reduce((a, s) => a + (Number(s.duracion) || 30), 0), d.estilistaId || '');
}

function reservar_(d) {
  const cfg = reservaSalon_(d);
  const nombre = String(d.nombre || '').trim().replace(/\s+/g, ' ').slice(0, 60);
  const tel = String(d.telefono || '').replace(/\D/g, '');
  if (nombre.length < 3) throw new Error('Escribe tu nombre completo');
  if (tel.length < 8) throw new Error('Escribe tu número de WhatsApp');
  const c = CacheService.getScriptCache(), k = 'RV_' + (SALON ? SALON.id : '') + tel.slice(-8), n = Number(c.get(k) || 0);
  if (n >= 3) throw new Error('Ya hiciste varias reservas. Si necesitas otra, escríbele al salón por WhatsApp.');
  const l = serviciosReserva_(d.servicios), dur = l.reduce((a, s) => a + (Number(s.duracion) || 30), 0);
  const libre = horasLibres_(cfg, d.fecha, dur, d.estilistaId || '').find(x => x.hora === d.hora);
  if (!libre) throw new Error('Ese horario se acaba de ocupar. Elige otro, por favor.');
  const estilistaId = d.estilistaId && libre.estilistas.indexOf(d.estilistaId) >= 0 ? d.estilistaId : libre.estilistas[0];
  let cli = rows_('Clientes').find(x => String(x.telefono || '').replace(/\D/g, '').slice(-8) === tel.slice(-8));
  if (!cli) {
    const t8 = tel.slice(-8);
    cli = upsert_('Clientes', { nombre: nombre, telefono: tel.length === 8 ? t8.slice(0, 4) + '-' + t8.slice(4) : '+' + tel, notas: 'Se registró en las reservas en línea', creado: ahora_() });
  }
  const ini = d.fecha + 'T' + d.hora, fin = d.fecha + 'T' + hhmm_(minutos_(d.hora) + dur);
  const cita = guardarCita_({ id: 'WEB', rol: 'admin' }, { registro: {
    clienteId: cli.id, estilistaId: estilistaId, tipo: 'servicio', refId: l[0].id, servicios: l.map(s => ({ id: s.id })),
    inicio: ini, fin: fin, precio: l.reduce((a, s) => a + (Number(s.precio) || 0), 0),
    notas: ('Reserva en línea' + (d.nota ? ' · ' + String(d.nota).slice(0, 200) : ''))
  } });
  c.put(k, String(n + 1), 21600);
  const est = rows_('Usuarios').find(x => x.id === estilistaId);
  return { inicio: cita.inicio, fin: cita.fin, servicios: l.map(s => s.nombre), estilista: est ? est.nombre : '', precio: cita.precio, cliente: cli.nombre, telefonoSalon: cfg.telefono };
}

async function guardarCitaApi(reg, forzar) {

/* ----- Formulario de cita ----- */
function svcsCita(c) {
  if (!c || c.tipo === 'tratamiento') return [];
  let l = [];
  try { l = c.servicios ? (typeof c.servicios === 'string' ? JSON.parse(c.servicios) : c.servicios) : []; } catch (e) { l = []; }
  if (!l.length && c.refId) { const s = byId(S.servicios, c.refId); if (s) l = [{ id: s.id, nombre: s.nombre, duracion: s.duracion, precio: c.precio === undefined || c.precio === '' ? s.precio : num(c.precio) }]; }
  return l.map(s => ({ id: s.id, nombre: s.nombre || (byId(S.servicios, s.id) || {}).nombre || 'Servicio', duracion: num(s.duracion), precio: num(s.precio) }));
}
function abrirCita(pre) {
  const c = Object.assign({ tipo: 'servicio', estado: 'pendiente', notas: '' }, pre || {});
  const nueva = !c.id;
  if (!c.inicio) { const d = new Date(); d.setMinutes(Math.ceil(d.getMinutes() / 15) * 15, 0, 0); c.inicio = toLocal(d); }
  const dur = c.fin ? diffMin(c.inicio, c.fin) : 60;
  const ests = estilistas().slice();
  if (S.user.rol === 'estilista') { c.estilistaId = S.user.id; if (!ests.some(u => u.id === S.user.id)) ests.push(S.user); }
  if (!c.estilistaId) c.estilistaId = (ests[0] || {}).id || '';
  const cli = c.clienteId ? byId(S.clientes, c.clienteId) : null;
  let tipo = c.tipo === 'tratamiento' ? 'tratamiento' : 'servicio';
  let sel = svcsCita(c);
  const refInicial = c.planId ? 'P:' + c.planId : (c.refId && tipo === 'tratamiento') ? 'T:' + c.refId : '';

  modal(nueva ? 'Nueva cita' : 'Editar cita', `<form class="form" id="f-cita" onsubmit="return false">
    <label class="f full">Cliente<div class="input-row"><input class="input" id="c-cli" list="dl-cli" autocomplete="off" placeholder="Buscar por nombre o teléfono" value="${cli ? esc(cliLabel(cli)) : ''}">
      ${puede('admin', 'recepcion') ? `<button type="button" class="btn" id="c-cli-new" title="Cliente nuevo">${ico('plus')}</button>` : ''}</div></label>

    <label class="f">Hora<input class="input" type="time" id="c-hora" step="${(parseInt(S.config.intervalo, 10) || 15) * 60}" value="${c.inicio.slice(11, 16)}"></label>
    <label class="f">Duración total (min)<input class="input" type="number" id="c-dur" min="5" step="5" value="${dur}"></label>
    <label class="f">Precio total (${esc(S.config.moneda || 'L')})<input class="input" type="number" id="c-precio" min="0" step="0.01" value="${c.precio === undefined ? '' : c.precio}"></label>
    <p class="f muted sm" id="c-info" style="align-self:end"></p>
    <label class="f full">Notas<textarea class="input" id="c-notas" rows="2" placeholder="Preferencias, alergias, indicaciones…">${esc(c.notas || '')}</textarea></label>
  </form><datalist id="dl-cli">${S.clientes.map(x => `<option value="${esc(cliLabel(x))}"></option>`).join('')}</datalist>`, [
    ...(!nueva && puede('admin') ? [{ t: ico('trash') + ' Eliminar', cls: 'danger', fn: async () => {
      if (!(await confirmar('¿Eliminar esta cita definitivamente? (Recomendado: cancelarla)', { si: 'Eliminar', peligro: 1 }))) return;
      await api('eliminar', { entidad: 'Citas', id: c.id }); cerrarModal(); toast('Cita eliminada'); refrescarCitas();
