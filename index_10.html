    { t: 'Guardar cita', cls: 'pri', fn: async () => {
      const cl = clienteDe($('#c-cli').value);
      if (!cl) throw new Error('Selecciona un cliente de la lista o créalo con el botón +');
      const fecha = $('#c-fecha').value, hora = $('#c-hora').value, d = Math.max(5, num($('#c-dur').value));
      if (!fecha || !hora) throw new Error('Indica fecha y hora');
      const inicio = fecha + 'T' + hora;
      const reg = { id: c.id, clienteId: cl.id, estilistaId: $('#c-est').value, tipo, inicio, fin: addMin(inicio, d), notas: $('#c-notas').value.trim() };
      if (tipo === 'servicio') {
        if (!sel.length) throw new Error('Agrega al menos un servicio');
        Object.assign(reg, { refId: sel[0].id, planId: '', servicios: sel, precio: r2(sel.reduce((a, s) => a + s.precio, 0)) });
      } else {
        const ref = $('#c-ref').value;
        if (!ref) throw new Error('Selecciona el tratamiento');
        Object.assign(reg, { refId: ref.slice(0, 2) === 'P:' ? '' : ref.slice(2), planId: ref.slice(0, 2) === 'P:' ? ref.slice(2) : '', servicios: '', precio: num($('#c-precio').value) });
      }
      const r = await guardarCitaApi(reg);
      if (!r) return;
      toast(nueva ? 'Cita agendada' : 'Cita actualizada', 'ok'); refrescarCitas();
      S.citaMap[r.id] = r;
      compartirCita(r, nueva ? '¡Cita agendada! Envíale esta imagen' : 'Cita actualizada · imagen para el cliente');
    } }
  ]);

  const totales = () => {
    $('#c-dur').value = sel.reduce((a, s) => a + s.duracion, 0) || 60;
    $('#c-precio').value = r2(sel.reduce((a, s) => a + s.precio, 0));
  };
  const pintarSvcs = () => {
    const durT = sel.reduce((a, s) => a + s.duracion, 0), tot = sel.reduce((a, s) => a + s.precio, 0);
    $('#c-svcs').innerHTML = sel.length ? sel.map((s, i) => `<div class="svc-it"><div class="nm"><b>${esc(s.nombre)}</b><small>${s.duracion} min</small></div>
        <input class="input sm svc-p" type="number" min="0" step="0.01" inputmode="decimal" data-i="${i}" value="${s.precio}" aria-label="Precio de ${esc(s.nombre)}">
        <button type="button" class="btn icon ghost" data-q="${i}" aria-label="Quitar ${esc(s.nombre)}">${ico('x')}</button></div>`).join('')
        + `<div class="svc-tot"><span>${sel.length} servicio${sel.length > 1 ? 's' : ''} · ${durT} min</span><b>${money(tot)}</b></div>`
      : '<p class="muted sm" style="margin:0">Agrega uno o varios servicios con la lista de abajo.</p>';
    const cats = {};
    S.servicios.filter(s => s.activo && !sel.some(x => x.id === s.id)).forEach(s => { (cats[s.categoria || 'General'] = cats[s.categoria || 'General'] || []).push(s); });
    $('#c-add').innerHTML = `<option value="">${sel.length ? '+ Agregar otro servicio…' : '+ Agregar servicio…'}</option>` + Object.keys(cats).sort().map(k =>
      `<optgroup label="${esc(k)}">${cats[k].map(s => `<option value="${esc(s.id)}">${esc(s.nombre)} · ${s.duracion} min · ${money(s.precio)}</option>`).join('')}</optgroup>`).join('');
    $$('#c-svcs [data-q]').forEach(b => b.onclick = () => { sel.splice(+b.dataset.q, 1); totales(); pintarSvcs(); });
    $$('#c-svcs .svc-p').forEach(inp => inp.oninput = () => { sel[+inp.dataset.i].precio = num(inp.value); $('#c-precio').value = r2(sel.reduce((a, s) => a + s.precio, 0)); $('#c-svcs .svc-tot b').textContent = money(sel.reduce((a, s) => a + s.precio, 0)); });
  };
  $('#c-add').onchange = () => {
    const s = byId(S.servicios, $('#c-add').value); if (!s) return;
    sel.push({ id: s.id, nombre: s.nombre, duracion: num(s.duracion), precio: num(s.precio) });
    totales(); pintarSvcs();
  };
  let cambioRef = false;
  const infoRef = () => {
    const v = $('#c-ref').value; let txt = '';
    if (v.slice(0, 2) === 'P:') {
      const p = byId(S.planes, v.slice(2)), t = p && byId(S.tratamientos, p.tratamientoId);
      txt = p ? `Plan prepagado · saldo pendiente ${money(Math.max(0, p.precio - p.pagado))}` : '';
      if (t && cambioRef) $('#c-dur').value = t.duracion || 60;
      if (cambioRef) $('#c-precio').value = 0;
    } else if (v.slice(0, 2) === 'T:') {
      const t = byId(S.tratamientos, v.slice(2));
      if (t && cambioRef) { $('#c-dur').value = t.duracion || 60; $('#c-precio').value = r2(t.precio / Math.max(1, t.sesiones)); }
      txt = t ? `Precio sugerido por sesión (paquete completo ${money(t.precio)})` : '';
    }
    $('#c-info').textContent = txt;
  };
  const modo = selRef => {
    $$('#c-tipo button').forEach(b => b.classList.toggle('on', b.dataset.t === tipo));
    $('#c-svc-box').hidden = tipo !== 'servicio';
    $('#c-ref-w').hidden = tipo === 'servicio';
    $('#c-precio').readOnly = tipo === 'servicio';
    if (tipo === 'servicio') { $('#c-info').textContent = 'El precio total es la suma de los servicios.'; pintarSvcs(); return; }
    const cl = clienteDe($('#c-cli').value);
    const planes = cl ? S.planes.filter(p => p.clienteId === cl.id && (p.estado === 'activo' || 'P:' + p.id === selRef)) : [];
    let html = '<option value="">— Selecciona —</option>';
    if (planes.length) html += `<optgroup label="Planes del cliente (prepagados)">${planes.map(p => { const t = byId(S.tratamientos, p.tratamientoId) || {}; return `<option value="P:${esc(p.id)}">${esc(t.nombre || 'Plan')} · sesión ${p.sesionesUsadas + 1} de ${p.sesionesTotales}</option>`; }).join('')}</optgroup>`;
    html += `<optgroup label="Sesión suelta (sin plan)">${S.tratamientos.filter(t => t.activo).map(t => `<option value="T:${esc(t.id)}">${esc(t.nombre)} · ${t.duracion} min</option>`).join('')}</optgroup>`;
    $('#c-ref').innerHTML = html;
    if (selRef && $(`#c-ref option[value="${CSS.escape(selRef)}"]`)) $('#c-ref').value = selRef;
    infoRef();
  };
  modo(refInicial);
  cambioRef = true;
  if (nueva && c.planId) infoRef();
  $('#c-ref').onchange = infoRef;
  $$('#c-tipo button').forEach(b => b.onclick = () => { if (tipo === b.dataset.t) return; tipo = b.dataset.t; cambioRef = true; if (tipo === 'servicio') totales(); modo(''); });
  $('#c-cli').onchange = () => { if (tipo === 'tratamiento') modo($('#c-ref').value); };
  const nb = $('#c-cli-new');
  if (nb) {
    nb.onclick = () => { $('#c-newcli').hidden = !$('#c-newcli').hidden; $('#nc-nombre').focus(); };
    $('#nc-ok').onclick = async () => {
      const nombre = $('#nc-nombre').value.trim();
      if (!nombre) return toast('Escribe el nombre del cliente', 'error');
      try {
        const g = await api('guardar', { entidad: 'Clientes', registro: { nombre, telefono: $('#nc-tel').value.trim() } });
        S.clientes.push(g);
        $('#dl-cli').insertAdjacentHTML('beforeend', `<option value="${esc(cliLabel(g))}"></option>`);
        $('#c-cli').value = cliLabel(g); $('#c-newcli').hidden = true; toast('Cliente creado', 'ok');
      } catch (e) { err(e); }
    };
  }
}

/* ----- Detalle de cita ----- */
function detalleCita(id) {
  const c = S.citaMap[id]; if (!c) return;
  const cli = byId(S.clientes, c.clienteId) || { nombre: 'Cliente' };
  const e = ESTADOS[c.estado] || ESTADOS.pendiente;
  const plan = c.planId ? byId(S.planes, c.planId) : null;
  const col = colorCita(c);
  const html = `<div style="--c:${esc(col)}"><div class="det-head"><div class="det-date">${esc(fFechaLarga(c.inicio))}</div>
      <div class="det-time">${fHora(c.inicio)} – ${fHora(c.fin)}</div><span class="badge">${e.t}</span></div>
    <dl class="det-list">
      <dt>Cliente</dt><dd>${esc(cli.nombre)}${cli.telefono ? `<br><a href="tel:${esc(cli.telefono)}">${esc(cli.telefono)}</a>` : ''}</dd>
      <dt>${c.tipo === 'tratamiento' ? 'Tratamiento' : 'Servicio'}</dt><dd>${esc(descCita(c))}</dd>
      <dt>Estilista</dt><dd>${esc(nomUsuario(c.estilistaId))}</dd>
      <dt>Precio</dt><dd>${plan ? 'Incluido en plan prepagado' : money(c.precio)}</dd>
      ${cli.notas ? `<dt>Ficha</dt><dd class="muted">${esc(cli.notas)}</dd>` : ''}
      ${c.notas ? `<dt>Notas</dt><dd>${esc(c.notas)}</dd>` : ''}
    </dl>
    ${cli.telefono ? `<a class="btn wa" style="margin-top:14px" href="${esc(waLink(cli, c))}" target="_blank" rel="noopener">Enviar recordatorio por WhatsApp</a>` : ''}
    ${plan ? `<div style="margin-top:14px"><div class="sm muted" style="margin-bottom:6px">Avance del plan: ${plan.sesionesUsadas} de ${plan.sesionesTotales} sesiones</div><div class="bar" style="--c:${esc(col)}"><i style="width:${Math.min(100, plan.sesionesUsadas / Math.max(1, plan.sesionesTotales) * 100)}%"></i></div></div>` : ''}</div>`;
  const b = [];
  const ed = puedeEditarCita(c);
  const est = async (nuevo, txt) => {
    if (txt && !(await confirmar(txt))) return;
    await api('estadoCita', { id: c.id, estado: nuevo });
    if (c.planId) await recargar(true);
    cerrarModal(); toast('Cita: ' + ESTADOS[nuevo].t, 'ok'); refrescarCitas();
  };
  b.push({ t: 'Imagen para el cliente', cls: '', fn: () => compartirCita(c) });
  if (c.clienteId && byId(S.clientes, c.clienteId)) b.push({ t: 'Ficha técnica', cls: '', fn: () => fichaCliente(byId(S.clientes, c.clienteId), { servicio: descCita(c).split(' · plan')[0], estilistaId: c.estilistaId }) });
  if (ed) {
    if (c.estado === 'pendiente') b.push({ t: 'Confirmar', cls: '', fn: () => est('confirmada') });
    if (['pendiente', 'confirmada'].includes(c.estado)) {
      b.push({ t: 'Cancelar cita', cls: 'danger', fn: () => est('cancelada', '¿Cancelar esta cita?') });
      b.push({ t: 'No asistió', cls: '', fn: () => est('no_asistio', '¿Marcar que el cliente no asistió?') });
      b.push({ t: 'Editar', cls: '', fn: () => { cerrarModal(); abrirCita(c); } });
      b.push({ t: 'Iniciar', cls: 'pri', fn: () => est('en_proceso') });
    }
    if (c.estado === 'en_proceso') {
      if (!plan) b.push({ t: 'Cobrar', cls: 'ok', fn: () => cobrarCita(c) });
      b.push({ t: 'Completar', cls: 'pri', fn: () => est('completada') });
    }
    if (c.estado === 'completada') b.push({ t: 'Deshacer completada', cls: '', fn: () => est('en_proceso', '¿Regresar esta cita a «En proceso»?' + (plan ? ' La sesión se devuelve al plan del cliente.' : '')) });
    if (c.estado === 'completada' && !plan) b.push({ t: 'Cobrar', cls: 'ok', fn: () => cobrarCita(c) });
    if (['cancelada', 'no_asistio'].includes(c.estado)) b.push({ t: 'Reactivar', cls: 'pri', fn: () => est('pendiente') });
  }
  if (puede('admin')) b.push({ t: ico('trash') + ' Eliminar', cls: 'danger', fn: async () => {
    const msg = '¿Eliminar esta cita de la agenda? No se puede deshacer.' + (c.estado === 'completada' ? (plan ? ' La sesión se devuelve al plan del cliente.' : ' Si ya se cobró, la venta no se borra: anúlala en Ventas › Historial si también fue un error.') : '');
    if (!(await confirmar(msg, { si: 'Eliminar', peligro: 1 }))) return;
    await api('eliminar', { entidad: 'Citas', id: c.id });
    delete S.citaMap[c.id];
    if (plan) await recargar(true);
    cerrarModal(); toast('Cita eliminada', 'ok'); refrescarCitas();
  } });
  modal('Detalle de la cita', html, b);
}
function cobrarCita(c) {
  const l = svcsCita(c);
  S.ticket = l.length ? l.map(s => ({ tipo: 'servicio', refId: s.id, descripcion: s.nombre, cantidad: 1, precio: s.precio, color: (byId(S.servicios, s.id) || {}).color }))
    : [{ tipo: 'servicio', refId: c.refId, descripcion: descCita(c), cantidad: 1, precio: num(c.precio), color: colorCita(c) }];
  S.ticketCliente = c.clienteId; S.ticketCita = c.id; S.posTab = 'servicio';
  cerrarModal(); ir('ventas');
}

/* ===================== VENTAS (POS + HISTORIAL) ===================== */
function vVentas() {
  const el = $('#v-ventas');
  el.innerHTML = `<div class="tabs"><button data-t="pos" class="on">Punto de venta</button><button data-t="hist">Historial de ventas</button></div><div id="ven-body"></div>`;
  $$('.tabs button', el).forEach(b => b.onclick = () => { $$('.tabs button', el).forEach(x => x.classList.toggle('on', x === b)); b.dataset.t === 'pos' ? posRender() : histRender(); });
  posRender();
}
function totales() {
  const sub = S.ticket.reduce((a, i) => a + i.cantidad * i.precio, 0);
  const desc = Math.min(Math.max(0, num(($('#p-desc') || {}).value)), sub);
  const base = sub - desc, tasa = num(S.config.isv), incl = S.config.preciosConISV !== 'no';
  let isv, total;
  if (incl) { total = base; isv = tasa ? base - base / (1 + tasa) : 0; } else { isv = base * tasa; total = base + isv; }
  return { sub, desc, isv, total, incl, tasa };
}
function posRender() {

  $('#ven-body').innerHTML = `<div class="pos">

      <div class="pgrid" id="p-grid"></div>
    </section>
    <section class="card pos-tk">
      <h3>Ticket ${S.ticketCita ? '<span class="badge" style="--b:#3b82c4">De cita</span>' : ''}</h3>
      <label class="form" style="display:block"><span class="f">Cliente<input class="input" id="p-cli" list="dl-pcli" placeholder="Consumidor final" value="${cli ? esc(cliLabel(cli)) : ''}" autocomplete="off"></span></label>
      <datalist id="dl-pcli">${S.clientes.map(x => `<option value="${esc(cliLabel(x))}"></option>`).join('')}</datalist>
      <div id="p-planes"></div>
      <div class="tk-items" id="p-items"></div>
      <div class="tk-tot" id="p-tot"></div>
      <div class="form" style="margin-bottom:12px">

        <label class="f">Método de pago<select class="input" id="p-met"><option>Efectivo</option><option>Tarjeta</option><option>Transferencia</option><option>Mixto</option></select></label>
        <label class="f" id="p-rec-w">Recibido<input class="input" type="number" id="p-rec" min="0" step="0.01" placeholder="0.00"></label>

        <label class="f full">Nota<input class="input" id="p-nota" placeholder="Opcional"></label>

      <button class="btn pri big" id="p-cobrar">Cobrar</button>
      <button class="btn ghost big" id="p-vaciar" style="margin-top:6px">Vaciar ticket</button>
    </section></div>`;
  $$('#p-tab button').forEach(b => b.onclick = () => { S.posTab = b.dataset.t; gridPos(); });
  $('#p-q').oninput = gridPos;
  $('#p-cli').onchange = () => { const c = clienteDe($('#p-cli').value); S.ticketCliente = c ? c.id : ''; hintPlanes(); };
  $('#p-desc').oninput = ticketPos;
  $('#p-rec').oninput = ticketPos;
  $('#p-met').onchange = () => { $('#p-rec-w').style.visibility = $('#p-met').value === 'Efectivo' ? 'visible' : 'hidden'; ticketPos(); };
  $('#p-vaciar').onclick = () => { S.ticket = []; S.ticketCita = ''; S.ticketCliente = ''; posRender(); };

  gridPos(); ticketPos(); hintPlanes();
}
function gridPos() {
  $$('#p-tab button').forEach(b => b.classList.toggle('on', b.dataset.t === S.posTab));
  const q = ($('#p-q').value || '').toLowerCase();
  const m = x => !q || [x.nombre, x.categoria, x.codigo].some(v => String(v || '').toLowerCase().includes(q));
  let items = [];
  if (S.posTab === 'servicio') items = S.servicios.filter(s => s.activo && m(s)).map(s => ({ x: s, sub: `${s.duracion} min`, dis: false }));
  if (S.posTab === 'producto') items = S.productos.filter(p => p.activo && m(p)).map(p => ({ x: p, sub: p.stock > 0 ? `Stock: ${p.stock}` : 'Agotado', dis: p.stock <= 0 }));
  if (S.posTab === 'tratamiento') items = S.tratamientos.filter(t => t.activo && m(t)).map(t => ({ x: t, sub: `${t.sesiones} sesiones`, dis: false }));
  $('#p-grid').innerHTML = items.length ? items.map(i => `<button class="pitem" data-id="${esc(i.x.id)}" ${i.dis ? 'disabled' : ''} style="--c:${esc(i.x.color || (S.posTab === 'producto' ? '#c8a165' : '#8e3b63'))}">
      <b>${esc(i.x.nombre)}</b><span class="muted sm">${esc(i.sub)}</span><span class="pp">${money(i.x.precio)}</span></button>`).join('')
    : '<div class="empty" style="grid-column:1/-1">Sin resultados.</div>';
  $$('#p-grid .pitem').forEach(b => b.onclick = () => agregarTicket(S.posTab, b.dataset.id));
}
function agregarTicket(tipo, id) {
  const lista = { servicio: S.servicios, producto: S.productos, tratamiento: S.tratamientos }[tipo];
  const x = byId(lista, id); if (!x) return;
  const ya = S.ticket.find(i => i.tipo === tipo && i.refId === id);
  if (ya) {
    if (tipo === 'producto' && ya.cantidad >= x.stock) return toast('No hay más stock de ' + x.nombre, 'error');
    ya.cantidad++;
  } else {
    S.ticket.push({ tipo, refId: id, descripcion: tipo === 'tratamiento' ? 'Paquete: ' + x.nombre : x.nombre, cantidad: 1, precio: num(x.precio), color: x.color });
  }
  ticketPos();
}
function ticketPos() {
  const box = $('#p-items'); if (!box) return;
  box.innerHTML = S.ticket.length ? S.ticket.map((i, n) => `<div class="tk-it"><div class="nm">${esc(i.descripcion)}<small>${money(i.precio)} c/u${i.tipo === 'abono' ? ' · abono' : ''}</small></div>
      <div class="qty">${i.tipo === 'abono' ? '' : `<button data-n="${n}" data-d="-1">−</button><b>${i.cantidad}</b><button data-n="${n}" data-d="1">+</button>`}</div>
      <b style="min-width:80px;text-align:right">${money(i.cantidad * i.precio)}</b>
      <button class="btn icon ghost" data-del="${n}">${ico('x')}</button></div>`).join('')
    : '<div class="empty sm">Toca un servicio o producto para agregarlo.</div>';

    <label class="f">Sesiones usadas<input class="input" type="number" id="pl-u" min="0" value="${p.sesionesUsadas || 0}"></label>

    <label class="f full">Notas<textarea class="input" id="pl-n" rows="2">${esc(p.notas || '')}</textarea></label>
    ${nuevo ? '<p class="f full muted sm">Consejo: para cobrar el paquete al momento, véndelo desde Ventas → Paquetes de tratamiento; el plan se crea solo.</p>' : '<p class="f full muted sm">Los pagos se registran con “Abonar” para que queden en caja.</p>'}
  </form>`, [

    { t: 'Guardar', cls: 'pri', fn: async () => {

  String(txt).split(' ').forEach(w => { const t = l ? l + ' ' + w : w; if (ctx.measureText(t).width > max && l) { out.push(l); l = w; } else l = t; });
  if (l) out.push(l);

async function compartirCita(c, titulo) {
  const cli = byId(S.clientes, c.clienteId) || { nombre: 'Cliente' };
  const nombre = `cita-${cli.nombre.split(' ')[0].toLowerCase().normalize('NFD').replace(/[^a-z]/g, '')}-${c.inicio.slice(0, 10)}.png`;
  let cv;
  try { cv = await dibujarTarjeta(c); } catch (e) { return err(e); }
  const url = cv.toDataURL('image/png');
  const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
  const archivo = blob ? new File([blob], nombre, { type: 'image/png' }) : null;
  const sePuede = !!(archivo && navigator.canShare && (() => { try { return navigator.canShare({ files: [archivo] }); } catch (e) { return false; } })());
  const b = [{ t: 'Descargar imagen', cls: '', fn: () => {
    const a = document.createElement('a'); a.href = url; a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
    toast('Imagen guardada: ' + nombre, 'ok');
  } }];
  if (sePuede) b.push({ t: 'Compartir', cls: 'pri', fn: async () => {
    try { await navigator.share({ files: [archivo], text: '' }); } catch (e) { if (e && e.name !== 'AbortError') toast('No se pudo abrir el menú de compartir', 'error'); }
  } });
  modal(titulo || 'Imagen para el cliente', `<img src="${url}" class="share-img" alt="Confirmación de la cita de ${esc(cli.nombre)}">
    <p class="muted sm" style="text-align:center;margin:12px 0 0">${sePuede ? 'Toca <b>Compartir</b> y elige WhatsApp para enviársela a ' + esc(cli.nombre.split(' ')[0]) + '.' : 'Descárgala y adjúntala en el chat de WhatsApp del cliente.'}</p>
    ${cli.telefono ? `<div style="text-align:center;margin-top:10px"><a class="btn wa" href="${esc(waLink(cli, c))}" target="_blank" rel="noopener">Abrir chat de ${esc(cli.nombre.split(' ')[0])} en WhatsApp</a></div>` : ''}`, b);
}

function fondoMarca(x, W, H) {
  const T = temaActual(), g = x.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, T.img[0]); g.addColorStop(.55, T.img[1]); g.addColorStop(1, T.img[2]);
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  [[W - 120, 140, 520, hexA(T.oro, .3)], [80, H - 80, 460, hexA(T.brand, .45)]].forEach(([cx, cy, r, col]) => {
    const rg = x.createRadialGradient(cx, cy, 0, cx, cy, r); rg.addColorStop(0, col); rg.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = rg; x.fillRect(0, 0, W, H);
  });
  [[150, 120, 14, .8], [930, 300, 10, .7], [990, 210, 6, .6], [110, 430, 8, .5], [960, H - 200, 12, .7], [140, H - 110, 7, .6]].forEach(b => brillo(x, ...b));
  x.strokeStyle = T.oro; x.globalAlpha = .9; x.lineWidth = 2; rr(x, 36, 36, W - 72, H - 72, 28); x.stroke();
  x.globalAlpha = .4; x.lineWidth = 1; rr(x, 50, 50, W - 100, H - 100, 22); x.stroke(); x.globalAlpha = 1;
}
async function logoListo() {

}
// Logo del salón en una placa blanca; si no hay logo, el emblema de tijeras. Devuelve la mitad de su alto.
function logoMarca(x, cx, cy) {

function asignarUtilidad(mes) {
  const h = S.histU, m = h.meses.find(x => x.mes === mes); if (!m) return;

      if (!reg.destino) throw new Error(tipo === 'pago' ? 'Indica qué se va a pagar' : 'Indica a qué cuenta va el dinero');
      if (!(reg.monto > 0)) throw new Error('Escribe el monto');
      if (reg.monto > m.pendiente + 0.001) throw new Error('El monto supera lo disponible (' + money(m.pendiente) + ')');
      S.histU = await api('guardarDistribucion', { registro: reg });

      if ($('#rep-body') && S.repTab === 'historial') pintarHistorial();

    $$('#as-tipo button').forEach(b => b.classList.toggle('on', b.dataset.t === tipo));

    $('#as-info').textContent = tipo === 'cuenta' ? 'El monto se suma al saldo acumulado de esa cuenta en el historial.'

  };

  $$('#m-body [data-p]').forEach(b => b.onclick = () => { $('#as-monto').value = r2(m.pendiente * b.dataset.p / 100); });
  pintarTipo();
}

/* ===================== SELECTOR DE CATEGORÍA (usadas + nueva) ===================== */
const uniq = arr => { const vis = {}; return arr.map(x => String(x || '').trim()).filter(x => x && !vis[x.toLowerCase()] && (vis[x.toLowerCase()] = 1)); };
const porUso = arr => { const n = {}; arr.forEach(x => { x = String(x || '').trim(); if (x) n[x] = (n[x] || 0) + 1; }); return Object.keys(n).sort((a, b) => n[b] - n[a] || a.localeCompare(b)); };
function comboHTML(id, opciones, valor, placeholder) {
  const v = String(valor || '').trim();
  const existe = !v || opciones.some(o => o.toLowerCase() === v.toLowerCase());
  const nuevaSola = !opciones.length;
  return `<div class="combo"><select class="input" id="${id}-sel">
      <option value="">— Selecciona —</option>
      ${opciones.map(o => `<option value="${esc(o)}" ${o.toLowerCase() === v.toLowerCase() ? 'selected' : ''}>${esc(o)}</option>`).join('')}
      <option value="__nueva" ${!existe || nuevaSola ? 'selected' : ''}>+ Nueva…</option></select>
    <input class="input" id="${id}-txt" placeholder="${esc(placeholder || 'Escribe el nombre')}" value="${existe ? '' : esc(v)}" ${!existe || nuevaSola ? '' : 'hidden'} autocomplete="off"></div>`;
}
function comboEnlazar(id, alCambiar) {
  const s = $('#' + id + '-sel'), t = $('#' + id + '-txt');
  if (!s) return;
  s.onchange = () => { t.hidden = s.value !== '__nueva'; if (!t.hidden) t.focus(); if (alCambiar) alCambiar(); };
  t.oninput = () => { if (alCambiar) alCambiar(); };
}
function comboValor(id) {
  const s = $('#' + id + '-sel');
  return s.value === '__nueva' ? $('#' + id + '-txt').value.trim() : s.value;
}

function rangoMes(desplazo) {

      const t2 = ((rot(a, 2) ^ rot(a, 13) ^ rot(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;

// Achica el logo para guardarlo en la hoja (una celda admite ~50.000 caracteres)
function reducirLogo(file) {
  return new Promise((ok, mal) => {
    if (!/^image\//.test(file.type)) return mal(new Error('Elige una imagen (PNG o JPG)'));
    const r = new FileReader();
    r.onerror = () => mal(new Error('No se pudo leer la imagen'));
    r.onload = () => {
      const im = new Image();
      im.onerror = () => mal(new Error('No se pudo abrir la imagen'));
      im.onload = () => {
        for (const lado of [360, 300, 240, 200, 160, 128]) {
          const k = Math.min(1, lado / Math.max(im.width, im.height)), w = Math.max(1, Math.round(im.width * k)), hh = Math.max(1, Math.round(im.height * k));
          const cv = document.createElement('canvas'); cv.width = w; cv.height = hh;
          const x = cv.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(im, 0, 0, w, hh);
          for (const [tipo, q] of [['image/png'], ['image/webp', .9], ['image/jpeg', .88]]) {
            if (tipo === 'image/jpeg') { const c2 = document.createElement('canvas'); c2.width = w; c2.height = hh; const y = c2.getContext('2d'); y.fillStyle = '#fff'; y.fillRect(0, 0, w, hh); y.drawImage(cv, 0, 0); const u = c2.toDataURL(tipo, q); if (u.length < 45000) return ok(u); continue; }
            const u = cv.toDataURL(tipo, q);
            if (u.indexOf('data:' + tipo) === 0 && u.length < 45000) return ok(u);
          }
        }
        mal(new Error('El logo es muy pesado. Prueba con una imagen más sencilla.'));
      };
      im.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

const fCorta = iso => parseLocal(iso).toLocaleDateString('es-HN', { day: 'numeric', month: 'long' });
function estadoPromo(p) {
  const h = hoy();
  if (p.hasta && h > p.hasta) return 'Vencida';
  if (!p.activo) return 'Pausada';
  if (p.desde && h < p.desde) return 'Próxima';
  return 'Vigente';
}
function ofertaPromo(p) {
  if (p.tipo === 'porcentaje') return { g: r2(p.descuento) + '%', c: 'de descuento' };
  if (p.tipo === 'precio') return { g: money(p.precio).replace('.00', ''), c: num(p.precioAntes) > 0 ? 'antes ' + money(p.precioAntes).replace('.00', '') : 'precio especial', antes: num(p.precioAntes) > 0 };
  if (p.tipo === '2x1') return { g: '2 x 1', c: 'llévate dos, paga uno' };
  return { g: 'Gratis', c: 'de regalo para ti' };
}
function vigenciaPromo(p) {
  if (p.desde && p.hasta) return p.desde.slice(0, 7) === p.hasta.slice(0, 7) ? `Válida del ${parseLocal(p.desde).getDate()} al ${fCorta(p.hasta)}` : `Válida del ${fCorta(p.desde)} al ${fCorta(p.hasta)}`;
  if (p.hasta) return 'Válida hasta el ' + fCorta(p.hasta);
  if (p.desde) return 'Desde el ' + fCorta(p.desde);
  return 'Por tiempo limitado';
}

/* ===================== FOTOS (se achican antes de subir) ===================== */
function achicarFoto(file, lado, calidad) {
  return new Promise((ok, mal) => {
    if (!/^image\//.test(file.type)) return mal(new Error('Elige una foto'));
    const r = new FileReader();
    r.onerror = () => mal(new Error('No se pudo leer la foto'));
    r.onload = () => {
      const im = new Image();
      im.onerror = () => mal(new Error('No se pudo abrir la foto'));
      im.onload = () => {
        const k = Math.min(1, (lado || 1200) / Math.max(im.width, im.height));
        const cv = document.createElement('canvas'); cv.width = Math.round(im.width * k); cv.height = Math.round(im.height * k);
        const x = cv.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, cv.width, cv.height); x.drawImage(im, 0, 0, cv.width, cv.height);
        ok(cv.toDataURL('image/jpeg', calidad || .78));
      };
      im.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

// En la página pública los errores del servidor se explican en palabras simples
function errorReserva(m) {
  m = String(m || '');
  if (/^PRUEBA_VENCIDA\|/.test(m)) return 'Las reservas en línea de este salón no están disponibles por ahora.';
  if (m === 'SESION' || /Acción no válida/.test(m)) return 'Las reservas en línea todavía no están listas en este salón. Escríbele por WhatsApp para agendar.';
  return m;
}
async function modoReserva(salon) {
  S.reserva = true; S.token = '';
  document.body.classList.add('reserva');
  $('#login').hidden = true; $('#app').hidden = true;
  const R = { salon, sel: [], est: '', fecha: '', hora: '' };
  const box = document.createElement('div'); box.id = 'rv'; document.body.appendChild(box);
  box.innerHTML = '<div class="rv-card"><div class="empty">Cargando…</div></div>';
  let info;
  try { info = await api('reservaInfo', { salon }); }
  catch (e) { box.innerHTML = `<div class="rv-card"><div class="rv-head"><div class="logo">${ico('cal')}</div><h1>Reservas en línea</h1></div><p class="muted" style="text-align:center;line-height:1.5">${esc(errorReserva(e.message))}</p></div>`; return; }
  aplicarTema(info.tema || 'vino'); S.config = Object.assign({}, S.config, { moneda: info.moneda });
  document.title = 'Reservar cita · ' + info.nombre;
  const dias = String(info.dias).split(',');
  const fechas = []; for (let i = 0; fechas.length < 14 && i < 45; i++) { const f = addDias(info.hoy, i); if (dias.includes(String(parseLocal(f).getDay()))) fechas.push(f); }
  const cats = {}; info.servicios.forEach(s => { (cats[s.categoria || 'Servicios'] = cats[s.categoria || 'Servicios'] || []).push(s); });
  const durTotal = () => R.sel.reduce((a, id) => a + (info.servicios.find(s => s.id === id) || {}).duracion, 0);
  const precioTotal = () => R.sel.reduce((a, id) => a + num((info.servicios.find(s => s.id === id) || {}).precio), 0);
  box.innerHTML = `<div class="rv-card">
    <div class="rv-head">${info.logo ? `<div class="logo"><img src="${info.logo}" alt=""></div>` : `<div class="logo">${ico('cut')}</div>`}<h1>${esc(info.nombre)}</h1><p class="muted">Reserva tu cita en línea</p>${info.mensaje ? `<p class="rv-msg">${esc(info.mensaje)}</p>` : ''}</div>
    <section class="rv-paso"><h3><i>1</i> ¿Qué te vas a hacer?</h3><div id="rv-svcs">${Object.keys(cats).map(c => `<div class="rv-cat">${esc(c)}</div>${cats[c].map(s => `<label class="rv-svc"><input type="checkbox" value="${esc(s.id)}"><span class="grow"><b>${esc(s.nombre)}</b><small>${s.duracion} min</small></span><b>${money(s.precio)}</b></label>`).join('')}`).join('')}</div>
      <div class="rv-tot" id="rv-tot" hidden></div></section>
    <section class="rv-paso" id="rv-p2" hidden><h3><i>2</i> ¿Con quién?</h3><div class="rv-chips" id="rv-est"><button type="button" data-e="" class="on">Cualquiera</button>${info.estilistas.map(e => `<button type="button" data-e="${esc(e.id)}" style="--c:${esc(e.color || '#8e3b63')}">${esc(e.nombre.split(' ')[0])}</button>`).join('')}</div></section>
    <section class="rv-paso" id="rv-p3" hidden><h3><i>3</i> Elige el día y la hora</h3><div class="rv-dias" id="rv-dias">${fechas.map(f => { const d = parseLocal(f); return `<button type="button" data-f="${f}"><small>${f === info.hoy ? 'Hoy' : DIAS_SEM[d.getDay()]}</small><b>${d.getDate()}</b><small>${d.toLocaleDateString('es-HN', { month: 'short' }).replace('.', '')}</small></button>`; }).join('')}</div>
      <div class="rv-horas" id="rv-horas"><p class="muted sm">Toca un día para ver las horas libres.</p></div></section>
    <section class="rv-paso" id="rv-p4" hidden><h3><i>4</i> Tus datos</h3><form class="form" id="rv-form" onsubmit="return false">
      <label class="f full">Nombre completo<input class="input" id="rv-nom" autocomplete="name" maxlength="60" required></label>
      <label class="f full">Tu WhatsApp<input class="input" id="rv-tel" type="tel" inputmode="tel" autocomplete="tel" placeholder="9876-5432" required></label>
      <label class="f full">¿Algo que debamos saber? (opcional)<input class="input" id="rv-nota" maxlength="200"></label></form>
      <div class="rv-res" id="rv-res"></div>
      <button class="btn pri big" id="rv-ok" type="button" style="width:100%">Reservar mi cita</button><div class="login-err" id="rv-err"></div></section>
    <p class="l-pie">${info.telefono ? `¿Dudas? Escríbenos al WhatsApp <a href="https://wa.me/${String(info.telefono).replace(/\D/g, '').replace(/^(\d{8})$/, '504$1')}" target="_blank" rel="noopener">${esc(info.telefono)}</a>` : ''}${info.direccion ? '<br>' + esc(info.direccion) : ''}</p></div>`;
  const pasos = () => {
    $('#rv-tot').hidden = !R.sel.length;
    $('#rv-tot').innerHTML = R.sel.length ? `${R.sel.length} servicio${R.sel.length > 1 ? 's' : ''} · ${durTotal()} min · <b>${money(precioTotal())}</b>` : '';
    $('#rv-p2').hidden = !R.sel.length; $('#rv-p3').hidden = !R.sel.length; $('#rv-p4').hidden = !(R.sel.length && R.hora);
    if (R.hora) $('#rv-res').innerHTML = `<b>${esc(cap(fFechaLarga(R.fecha)))} · ${hora12(R.fecha + 'T' + R.hora)}</b><br>${esc(R.sel.map(id => info.servicios.find(s => s.id === id).nombre).join(' + '))}${R.est ? ' · con ' + esc((info.estilistas.find(e => e.id === R.est) || {}).nombre || '') : ''}`;
  };
  const cargarHoras = async () => {
    R.hora = ''; pasos();
    if (!R.fecha) return;
    const hb = $('#rv-horas'); hb.innerHTML = '<p class="muted sm">Buscando horas libres…</p>';
    try {
      const l = await api('reservaHoras', { salon, fecha: R.fecha, servicios: R.sel, estilistaId: R.est }, true);
      hb.innerHTML = l.length ? `<div class="rv-hgrid">${l.map(h => `<button type="button" data-h="${h.hora}">${hora12(R.fecha + 'T' + h.hora)}</button>`).join('')}</div>` : '<p class="muted sm">No hay horas libres ese día. Prueba con otro día u otra estilista.</p>';
      $$('[data-h]', hb).forEach(b => b.onclick = () => { R.hora = b.dataset.h; $$('[data-h]', hb).forEach(x => x.classList.toggle('on', x === b)); pasos(); $('#rv-p4').scrollIntoView({ behavior: 'smooth', block: 'start' }); });
    } catch (e) { hb.innerHTML = `<p class="login-err">${esc(e.message)}</p>`; }
  };
  $$('#rv-svcs input').forEach(i => i.onchange = () => { R.sel = $$('#rv-svcs input:checked').map(x => x.value); i.closest('.rv-svc').classList.toggle('on', i.checked); cargarHoras(); });
  $$('#rv-est [data-e]').forEach(b => b.onclick = () => { R.est = b.dataset.e; $$('#rv-est [data-e]').forEach(x => x.classList.toggle('on', x === b)); cargarHoras(); });
  $$('#rv-dias [data-f]').forEach(b => b.onclick = () => { R.fecha = b.dataset.f; $$('#rv-dias [data-f]').forEach(x => x.classList.toggle('on', x === b)); cargarHoras(); });
  $('#rv-ok').onclick = async () => {
    const btn = $('#rv-ok'); $('#rv-err').textContent = '';
    try {
      btn.disabled = true;
      const r = await api('reservar', { salon, servicios: R.sel, estilistaId: R.est, fecha: R.fecha, hora: R.hora, nombre: $('#rv-nom').value, telefono: $('#rv-tel').value, nota: $('#rv-nota').value });
      const tel = String(r.telefonoSalon || '').replace(/\D/g, '').replace(/^(\d{8})$/, '504$1');
      const msg = `Hola 👋, acabo de reservar en línea:\n📅 ${cap(fFechaLarga(r.inicio))} a las ${hora12(r.inicio)}\n💅 ${r.servicios.join(' + ')}${r.estilista ? '\n👩 Con ' + r.estilista : ''}\nA nombre de ${r.cliente}.`;
      $('.rv-card').innerHTML = `<div class="rv-head"><div class="logo rv-ok">✓</div><h1>¡Tu cita está reservada!</h1><p class="muted">${esc(r.cliente.split(' ')[0])}, te esperamos en ${esc(info.nombre)}</p></div>
        <div class="rv-conf"><div><span>Día</span><b>${esc(cap(fFechaLarga(r.inicio)))}</b></div><div><span>Hora</span><b>${hora12(r.inicio)} – ${hora12(r.fin)}</b></div>
        <div><span>Servicio</span><b>${esc(r.servicios.join(' + '))}</b></div>${r.estilista ? `<div><span>Te atiende</span><b>${esc(r.estilista)}</b></div>` : ''}<div><span>Valor aproximado</span><b>${money(r.precio)}</b></div></div>
        <p class="muted sm" style="text-align:center">El salón te confirmará por WhatsApp. Si no puedes asistir, avísanos con tiempo.</p>
        ${tel ? `<a class="btn wa big" style="width:100%" href="https://wa.me/${tel}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">Avisar al salón por WhatsApp</a>` : ''}
        <button class="btn ghost l-alt" type="button" onclick="location.reload()">Hacer otra reserva</button>`;
      window.scrollTo(0, 0);
    } catch (e) { $('#rv-err').textContent = e.message; if (/ocupar/.test(e.message)) cargarHoras(); }
    finally { if ($('#rv-ok')) btn.disabled = false; }
  };
}

/* ===================== APP ANDROID (APK) =====================
   Dentro del APK no existe el menú de compartir del navegador: se usa el puente SalonApp */
function puenteApp() {
  const A = window.SalonApp;
  if (!A) return;
  document.documentElement.classList.add('en-app');
  const b64 = blob => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1] || ''); r.onerror = () => no(new Error('No se pudo leer el archivo')); r.readAsDataURL(blob); });
  navigator.canShare = () => true;
  navigator.share = async d => {
    const f = d && d.files && d.files[0];
    if (!f) throw new Error('Nada para compartir');
    const r = A.compartir(await b64(f), f.name || 'imagen.png', f.type || 'image/png', (d && d.text) || '');
    if (r !== 'ok') throw new Error(r);
  };
  document.addEventListener('click', e => {
    const a = e.target && e.target.closest ? e.target.closest('a[download]') : null;
    if (!a) return;
    e.preventDefault(); e.stopPropagation();
    const nombre = a.getAttribute('download') || 'archivo';
    fetch(a.href).then(r => r.blob()).then(async blob => {
      const tipo = (blob.type || 'application/octet-stream').split(';')[0];
      const r = A.guardar(await b64(blob), nombre, tipo);
      if (r === 'galeria') toast('Imagen guardada en la galería', 'ok');
      else if (r === 'descargas') toast('Guardado en Descargas › Salon VM', 'ok');
      else if (r !== 'compartido') toast('No se pudo guardar: ' + r, 'error');
    }).catch(x => toast('No se pudo guardar el archivo', 'error'));
  }, true);
  window.print = () => A.imprimir();
}
// Botón «atrás» del teléfono: cierra lo abierto antes de salir de la app
function atrasApp() {
  if (!$('#dlg').hidden) { $('#dlg-no').click(); return 'ok'; }
  if (!$('#modal').hidden) { cerrarModal(); return 'ok'; }
  if ($('#nav') && $('#nav').classList.contains('open')) { menu(false); return 'ok'; }
  if (!$('#app').hidden && S.vista && S.vista !== 'inicio') { ir('inicio'); return 'ok'; }
  return 'salir';
}

/* ===================== ARRANQUE ===================== */
document.addEventListener('DOMContentLoaded', () => {
  puenteApp();
  aplicarTema(LS.get('salon_tema', 'vino'));
  try { if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
  { const rv = paramReserva(); if (rv !== null) { modoReserva(rv); return; } }
  $('#l-salon').textContent = LS.get('salon_nombre', '') || 'Salón de Belleza';
  if (MODO_CUENTAS) pintarCuentas();
  { const lg = LS.get('salon_logo', ''); if (lg) { S.config.logo = lg; pintarLogo(); } }
  $('#f-login').onsubmit = ingresar;
  $('#f-reg').onsubmit = registrarse;
  $('#l-alt').onclick = () => { S.lmodo = S.lmodo === 'reg' ? 'ing' : 'reg'; pintarLogin(); };
  $('#l-server').onclick = configServidor;
  $('#l-demo').onclick = alternarDemo;
  $('#demo-tag').onclick = menuDemo;
  $$('#l-demo-box [data-u]').forEach(b => b.onclick = () => { $('#l-user').value = b.dataset.u; $('#l-pass').value = b.dataset.p; $('#f-login').requestSubmit(); });
  $('#m-close').innerHTML = ico('x');
  $('#m-close').onclick = cerrarModal;
  $('#modal').addEventListener('mousedown', e => { if (e.target.id === 'modal') cerrarModal(); });
  document.addEventListener('keydown', e => { if (e.key !== 'Escape') return; if (!$('#dlg').hidden) $('#dlg-no').click(); else if (!$('#modal').hidden) cerrarModal(); });
  $('#menu-btn').innerHTML = ico('menu');
  $('#menu-btn').onclick = () => menu(!$('#nav').classList.contains('open'));
  $('#overlay').onclick = () => menu(false);
  $('#reload-btn').innerHTML = ico('refresh');
  $('#reload-btn').onclick = async () => { try { await recargar(); ir(S.vista); toast('Datos actualizados', 'ok'); } catch (e) { err(e); } };
  pintarLogin();
  if ((DEMO.on || apiUrl()) && S.token) arrancar().catch(e => { if (S.token) salir(true); errLogin(e.message); });
});
